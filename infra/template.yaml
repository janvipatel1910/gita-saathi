AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Gita Ghar - hosting (S3 + CloudFront), sign-in with an email code (Cognito),
  cloud backup (API Gateway + Lambda + DynamoDB), smart verse matching
  (Lambda + Amazon Bedrock) and a monthly budget alert.
  Deploy in eu-west-2 (London), the same region as the S3 bucket.

Parameters:
  BucketName:
    Type: String
    Default: gita-saathi-janvi
    Description: Existing private S3 bucket that holds the app files.
  AlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Email address for budget alerts. Not stored in the app.
  BudgetLimitUSD:
    Type: Number
    Default: 6
    Description: Monthly budget alert in US dollars (about 5 pounds).
  BedrockModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock EU cross-region inference profile used for smart matching.
  LocalTestOrigin:
    Type: String
    Default: http://localhost:8765
    Description: Extra origin allowed to call the API, for testing on your own computer.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tags:
      app: gita-ghar

Resources:

  # ---------------------------------------------------------------- hosting
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Lets CloudFront read the private app bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Gita Ghar app
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200   # Europe, North America, India and Asia
        Origins:
          - Id: app-bucket
            DomainName: !Sub "${BucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: app-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          # Files that must never be stale: the service worker and the app settings
          - PathPattern: sw.js
            TargetOriginId: app-bucket
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: config.js
            TargetOriginId: app-bucket
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ---------------------------------------------------------------- sign-in
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: gita-ghar-users
      UserPoolTier: ESSENTIALS            # needed for passwordless email codes
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
        SignInPolicy:
          AllowedFirstAuthFactors: [PASSWORD, EMAIL_OTP]
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT  # up to 50 emails a day; switch to Amazon SES before a public launch
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Gita Ghar code
        EmailMessage: "Jai Shri Krishna. Your Gita Ghar code is {####}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: gita-ghar-app
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 10
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------- data
  UserDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: gita-ghar-user-data
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: col
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: col
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------- API
  AppApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
          - !Ref LocalTestOrigin
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        "POST /match":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  SyncFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gita-ghar-sync
      RetentionInDays: 14

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gita-ghar-sync
      Description: Saves and loads a signed-in user's cards, notes and progress
      CodeUri: ../backend/sync/
      Handler: index.handler
      LoggingConfig:
        LogGroup: !Ref SyncFunctionLogs
      Environment:
        Variables:
          TABLE: !Ref UserDataTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt UserDataTable.Arn
      Events:
        Load:
          Type: HttpApi
          Properties: {ApiId: !Ref AppApi, Path: /sync, Method: GET, Auth: {Authorizer: CognitoJwt}}
        Save:
          Type: HttpApi
          Properties: {ApiId: !Ref AppApi, Path: /sync, Method: PUT, Auth: {Authorizer: CognitoJwt}}
        DeleteAll:
          Type: HttpApi
          Properties: {ApiId: !Ref AppApi, Path: /sync, Method: DELETE, Auth: {Authorizer: CognitoJwt}}

  MatchFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gita-ghar-match
      RetentionInDays: 14

  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gita-ghar-match
      Description: Picks the best-matching feelings for what someone types (never writes verses itself)
      CodeUri: ../backend/match/
      Handler: index.handler
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref MatchFunctionLogs
      Environment:
        Variables:
          MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
      Events:
        Match:
          Type: HttpApi
          Properties: {ApiId: !Ref AppApi, Path: /match, Method: POST, Auth: {Authorizer: NONE}}

  # ---------------------------------------------------------------- cost safety
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: gita-ghar-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  AppUrl:
    Description: Open the app here
    Value: !Sub "https://${SiteDistribution.DomainName}"
  DistributionId:
    Value: !Ref SiteDistribution
  ApiUrl:
    Value: !Sub "https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
