<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gita Saathi: an interactive Bhagavad Gita companion in English mixed with Hindi.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* languages */
:root:lang(gu){--display:"Baloo Bhai 2","Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Hind Vadodara","Mukta","Segoe UI",system-ui,sans-serif;--deva:"Noto Serif Gujarati","Hind Vadodara",serif}
.stage svg text{font-family:var(--display)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--peacock)}
.langs{display:flex;gap:4px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px}
.lang{background:transparent;color:var(--soft);padding:.3em .9em;font-size:.95rem}
.lang.on{background:var(--peacock);color:#fff}
.lang:hover{transform:none}
.door.gita{cursor:default;padding:0;overflow:hidden;gap:0}
.door.gita .doorbtn{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:20px 22px 10px}
.door.gita .doorbtn:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.door.gita .prog{height:8px;margin:4px 22px 0;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.door.gita .prog i{display:block;height:100%;background:#fff;border-radius:99px}
.door.gita .p{margin:8px 22px 0}
.cont{margin:12px 22px 20px;align-self:flex-start;background:#fff;color:var(--krishna)}
.today{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.today h2{color:var(--marigold);font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em}
.today .verse{display:flex;flex-direction:column;gap:6px}
.today .opt{align-self:flex-start}
.note-lang{margin:0;background:#fff3d6;border:2px solid var(--marigold);border-radius:12px;padding:8px 12px;font-size:.95rem}
</style>
<title>Gita Saathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Bhai+2:wght@500;600;700;800&family=Hind+Vadodara:wght@400;600&family=Mukta:wght@400;600&family=Noto+Serif+Gujarati:wght@400;600&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: home = Krishna banner + 3x3 grid of feelings + my cards; feeling view = storybook stage, dialogue box, action, keepsake card. One bright look by choice. */
:root{
  --page:#fff6e6; --ink:#2b2140; --soft:#6d5f80; --line:#eadcc4; --card:#ffffff;
  --peacock:#1f8a8a; --marigold:#f4a81d; --krishna:#3f7fd0; --rose:#d9534f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mukta","Segoe UI",system-ui,sans-serif;
  --deva:"Tiro Devanagari Sanskrit","Mukta","Noto Sans Devanagari",serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-weight:800;font-size:clamp(1.6rem,4.6vw,2.4rem);color:var(--peacock)}
h2{font-weight:700;font-size:1.25rem}
.lead{margin:0;font-size:1.1rem;color:var(--soft)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero svg{width:clamp(96px,22vw,150px);height:auto;display:block}
.hero > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.feel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.feel:hover{transform:translateY(-2px);border-color:var(--marigold)}
.feel .hi{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.15}
.feel .en{color:var(--soft);font-size:.95rem}
.feel .dot{width:14px;height:14px;border-radius:50%;margin-bottom:6px}
.feel.done{border-color:var(--peacock)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:4px solid var(--card);box-shadow:0 10px 30px rgba(43,33,64,.16);background:#cfe8f5}
.stage svg{width:100%;height:100%;display:block}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px}
.who{font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.03em;align-self:flex-start;padding:.05em .75em;border-radius:99px;color:#fff;background:var(--peacock)}
.who.K{background:var(--krishna)}
.say{font-size:clamp(1.05rem,2.6vw,1.25rem);line-height:1.5;margin:0}
.say em{font-style:normal;font-weight:600;color:var(--peacock)}
.verse{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.verse .dev{font-family:var(--deva);font-size:clamp(1.2rem,3.2vw,1.55rem);line-height:1.7;color:var(--ink)}
.verse .rom{font-style:italic;color:var(--peacock);font-size:1.02rem;line-height:1.45}
.verse .mean{font-size:1.12rem;line-height:1.5}
.verse .ref{font-size:.85rem;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.act{display:flex;flex-wrap:wrap;gap:8px}
.act:empty{display:none}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:700 1rem var(--display);border:0;border-radius:99px;padding:.55em 1.25em;cursor:pointer;background:var(--marigold);color:var(--ink);transition:transform .15s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,.feel:focus-visible{outline:3px solid var(--peacock);outline-offset:2px}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--soft)}
button.opt{background:#fff;border:2px solid var(--peacock);color:var(--peacock)}
button.opt:hover{background:var(--peacock);color:#fff}
button[disabled]{opacity:.4;cursor:default;transform:none}
.hold{position:relative;overflow:hidden;background:#fff;border:2px solid var(--marigold);user-select:none;-webkit-user-select:none;touch-action:none;min-width:230px}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:var(--marigold)}
.hold span{position:relative}
.field{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.field input{flex:1;min-width:0;font:400 1.05rem var(--body);padding:.55em .9em;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.keep{background:linear-gradient(160deg,#fff 0%,#fff3d6 100%);border:3px solid var(--marigold);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;text-align:center}
.keep .v{font-family:var(--display);font-weight:700;color:var(--peacock);font-size:1.05rem}
.keep .m{font-size:1.2rem;line-height:1.4}
.keep .f{color:var(--soft);font-size:.88rem}
.help{background:#fff;border:2px solid var(--line);border-left:6px solid var(--rose);border-radius:14px;padding:12px 16px;font-size:.95rem;line-height:1.5}
.help strong{color:var(--rose)}
.help.quiet{border-left-color:var(--line);color:var(--soft);font-size:.88rem}
.help.quiet strong{color:var(--soft)}
.cards{display:flex;flex-direction:column;gap:8px}
.mini{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.mini .r{font-size:.82rem;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.tiny{color:var(--soft);font-size:.85rem;margin:0}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.bob{animation:bob 3s ease-in-out infinite}
.flick{animation:flick 1.2s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.drift{animation:drift 6s ease-in forwards}
@keyframes pulse{50%{opacity:.35;transform:scale(1.06)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes flick{50%{transform:scaleY(1.12) scaleX(.92)}}
@keyframes drift{to{transform:translate(1300px,-160px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.who.A{background:var(--rose)} .who.N{background:var(--peacock)}
.stage.story{cursor:pointer}
.box.story{min-height:118px}
.say strong{font-family:var(--display);font-weight:700;color:var(--rose)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--marigold)} .dots span.done{background:var(--peacock)}
.titlecard{position:absolute;inset:0 0 auto;padding:5% 6% 0;text-align:center;pointer-events:none}
.titlecard .t{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4.6vw,2.9rem);color:#fff;text-shadow:0 3px 0 var(--peacock),0 6px 14px rgba(0,0,0,.25);line-height:1.05}
.titlecard .s{font-family:var(--display);font-weight:600;color:var(--ink);font-size:clamp(.8rem,2vw,1.15rem);margin-top:.3em}
.spacer{flex:1}
label.tts{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:.9rem;cursor:pointer}
.blessing{background:linear-gradient(160deg,#fff 0%,#fff3d6 100%);border:3px solid var(--marigold);border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;gap:6px;text-align:center}
.blessing .v{font-family:var(--display);font-weight:700;color:var(--peacock);font-size:1.2rem}
.blessing .m{font-size:1.2rem;line-height:1.4} .blessing .f{color:var(--soft);font-size:.9rem}
.hint{color:var(--soft);font-size:.85rem;margin:0}
.rain line{animation:rain .8s linear infinite}
.floatword{animation:floatw 3.2s ease-out forwards}
.grow{animation:grow .8s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 100%;transform-box:fill-box}
@keyframes rain{from{transform:translateY(-30px);opacity:0}30%{opacity:1}to{transform:translateY(60px);opacity:0}}
@keyframes floatw{from{transform:translateX(-200px);opacity:0}20%{opacity:1}to{transform:translateX(1500px);opacity:0}}
@keyframes grow{from{transform:scale(0)}}
/* home + chapters */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.doors{grid-template-columns:1fr}}
.door{border:0;border-radius:22px;padding:20px 22px;text-align:left;cursor:pointer;color:#fff;display:flex;flex-direction:column;gap:6px;font:inherit;min-height:150px;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door .k{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.6vw,1.8rem);line-height:1.1}
.door .d{font-size:1.02rem;line-height:1.4;opacity:.95}
.door .p{margin-top:auto;font-family:var(--display);font-weight:700;font-size:.95rem;background:rgba(255,255,255,.22);align-self:flex-start;padding:.15em .8em;border-radius:99px}
.door.feelings{background:var(--peacock)} .door.gita{background:var(--krishna)}
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left;font:inherit;color:var(--ink)}
.ch > span{min-width:0}
.ch .n{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--peacock);text-align:center;font-variant-numeric:tabular-nums}
.ch .t{display:flex;flex-direction:column}
.ch .t b{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.2}
.ch .t i{font-style:normal;color:var(--soft);font-size:.92rem}
.ch .s{font-family:var(--display);font-weight:700;font-size:.85rem;padding:.15em .75em;border-radius:99px;background:var(--line);color:var(--soft);white-space:nowrap}
.ch.open{cursor:pointer;border-color:var(--marigold)}
.ch.open .s{background:var(--marigold);color:var(--ink)}
.ch.open.done .s{background:var(--peacock);color:#fff}
.ch.locked{opacity:.7}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="lang/hi.js"></script>
<script src="lang/gu.js"></script>
<script>
(function(){
/* ---------- languages ---------- */
const I18N=window.I18N||{};
let LANG=(()=>{try{const l=localStorage.getItem("gs-lang");return (l==="hi"||l==="gu")?l:"en";}catch(e){return "en";}})();
const LANGS=[["en","English"],["hi","हिन्दी"],["gu","ગુજરાતી"]];
function setLangAttr(){document.documentElement.lang=LANG==="en"?"en-GB":LANG;}
setLangAttr();
function T(s){
  if(s==null||LANG==="en") return s;
  s=String(s); if(s.startsWith('<span class="verse">')) return s;
  const d=I18N[LANG]||{}; if(d[s]!=null) return d[s];
  const nums=[]; const k=s.replace(/\d+/g,m=>{nums.push(m);return "{"+(nums.length-1)+"}";});
  if(nums.length&&d[k]!=null) return d[k].replace(/\{(\d+)\}/g,(m,i)=>nums[+i]);
  if(window.__miss) window.__miss.add(s);
  return s;
}
function TF(s,v){return T(s).split("{v}").join(v);}
const GITA={hi:"भगवद्गीता",gu:"ભગવદ્ ગીતા"};
function TR(ref){
  if(LANG==="en"||!ref) return ref;
  return String(ref).replace(/\(([\d.]+) in some editions\)/,(m,n)=>"("+TF("{v} in some editions",n)+")").replace("All 18 chapters",T("All 18 chapters")).replace("Bhagavad Gita",GITA[LANG]);
}
function SCR(dev){return LANG==="gu"?dev.replace(/[\u0900-\u097F]/g,c=>(c==="।"||c==="॥")?c:String.fromCharCode(c.charCodeAt(0)+0x180)):dev;}
function ROM(r){return LANG==="en"?r:"";}
/* ---------- Krishna (original design) ---------- */
const SK="#3f7fd0",GOLD="#f4c430",HAIR="#1c1c2e";
function krishna(x,y,s,o){o=o||{};
  const arm=o.bless?`<path d="M40 -215 Q85 -240 92 -290" stroke="${SK}" stroke-width="22" stroke-linecap="round" fill="none"/><circle cx="92" cy="-300" r="15" fill="${SK}"/>`
                   :`<path d="M40 -215 Q70 -170 60 -135" stroke="${SK}" stroke-width="22" stroke-linecap="round" fill="none"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="bob">
  ${o.glow?`<circle cy="-220" r="200" fill="#fff3b0" class="pulse"/>`:""}
  <path d="M-52 0 L-42 -140 H42 L52 0Z" fill="#f7c948"/><path d="M-52 0 L-46 -40 H46 L52 0Z" fill="#e8a317"/>
  <rect x="-46" y="-150" width="92" height="18" rx="8" fill="#e05a47"/>
  <path d="M-42 -140 Q-48 -235 0 -238 Q48 -235 42 -140Z" fill="${SK}"/>
  <path d="M-30 -228 Q0 -192 30 -228" stroke="${GOLD}" stroke-width="7" fill="none"/>
  <path d="M-40 -215 Q-70 -170 -60 -135" stroke="${SK}" stroke-width="22" stroke-linecap="round" fill="none"/>${arm}
  ${o.flute?`<rect x="-80" y="-180" width="150" height="9" rx="4" fill="#b5651d" transform="rotate(-12)"/>`:""}
  <circle cy="-290" r="56" fill="${SK}"/>
  <path d="M-56 -292 Q-58 -355 0 -356 Q58 -355 56 -292 Q44 -330 0 -332 Q-44 -330 -56 -292Z" fill="${HAIR}"/>
  <path d="M-40 -336 L-32 -380 L-14 -358 L0 -392 L14 -358 L32 -380 L40 -336Z" fill="${GOLD}" stroke="#d99a00" stroke-width="3"/>
  <circle cy="-350" r="6" fill="#e05a47"/>
  <g transform="translate(24 -378) rotate(18)"><path d="M0 0 Q-12 -60 0 -105 Q14 -60 0 0Z" fill="#1f8a70"/><ellipse cy="-82" rx="12" ry="17" fill="#2fb3a0"/><circle cy="-82" r="7" fill="#1b3f8b"/></g>
  <path d="M0 -318 v-12" stroke="#e05a47" stroke-width="5" stroke-linecap="round"/>
  <path d="M-27 -290 q9 -10 18 0 M9 -290 q9 -10 18 0" stroke="${HAIR}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M-17 -268 q17 16 34 0" stroke="${HAIR}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="-32" cy="-274" r="9" fill="#ff8fa3" opacity=".45"/><circle cx="32" cy="-274" r="9" fill="#ff8fa3" opacity=".45"/>
  </g></g>`;}
const svg=(inner,vb)=>`<svg viewBox="${vb||"0 0 1600 900"}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`;
const sky=(a,b)=>`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sk)"/>`;
const hills=(c1,c2)=>`<path d="M0 600 Q300 520 620 580 T1600 560 V900 H0Z" fill="${c1}"/><path d="M0 680 Q400 630 800 680 T1600 670 V900 H0Z" fill="${c2}"/>`;
function diya(x,y,s,lit,steady){return `<g transform="translate(${x} ${y}) scale(${s})">${lit?`<circle cy="-60" r="110" fill="#ffd36b" opacity=".3" class="pulse"/>`:""}<path d="M-80 0 Q0 60 80 0 Z" fill="#d9622b"/><path d="M-80 0 Q0 25 80 0" stroke="#f4c430" stroke-width="5" fill="none"/>${lit?`<g class="${steady?"":"flick"}"><path d="M0 -80 C34 -40 28 0 0 4 C-28 0 -34 -40 0 -80Z" fill="#ffd36b"/><path d="M0 -50 C14 -30 12 -6 0 -2 C-12 -6 -14 -30 0 -50Z" fill="#fff6d6"/></g>`:`<line x1="0" y1="0" x2="0" y2="-24" stroke="#5a3a20" stroke-width="5"/>`}</g>`;}

/* ---------- content: Krishna's words are the verses; everything else is plain explanation ---------- */
const FEELINGS=[
 {id:"fear",hi:"Darr lag raha hai",en:"Worried about results",color:"#3f7fd0",sky:["#9fd4f0","#e6f6fc"],
  open:"Arjuna was afraid of what would happen. In Chapter 2, Krishna told him this.",
  ref:"Bhagavad Gita 2.47",
  dev:"कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।<br>मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥",
  rom:"Karmanye vadhikaraste, ma phaleshu kadachana. Ma karmaphala hetur bhur, ma te sango 'stvakarmani.",
  mean:"You have a right to your work, but never to its results. Don't work only for the reward, and don't give up on your work either.",
  simple:"Most worry lives in the future. Your effort lives in today. <em>Apni taakat wahan lagao jahan aapka bas chalta hai.</em> Put your energy where you have power.",
  act:{type:"write",q:"What is one thing you can do today, with full effort? Just one.",ph:"e.g. Revise one topic, or send one job application",card:v=>TF("Today I will: <strong>{v}</strong>. The result is not my worry.",v)}},
 {id:"anger",hi:"Gussa aa raha hai",en:"Angry",color:"#d9534f",sky:["#f6b49a","#fde6d8"],
  open:"Krishna warned Arjuna about where anger leads. This is from Chapter 2.",
  ref:"Bhagavad Gita 2.63",
  dev:"क्रोधाद्भवति सम्मोहः सम्मोहात्स्मृतिविभ्रमः।<br>स्मृतिभ्रंशाद्बुद्धिनाशो बुद्धिनाशात्प्रणश्यति॥",
  rom:"Krodhad bhavati sammohah, sammohat smriti vibhramah. Smriti bhranshad buddhi nasho, buddhi nashat pranashyati.",
  mean:"From anger comes confusion. Confusion clouds memory. When memory is lost, judgement is destroyed, and when judgement is destroyed, a person falls.",
  simple:"Anger feels powerful, but it switches off our wisdom. A pause switches it back on. <em>Pehle saans, phir jawaab.</em>",
  act:{type:"count",q:"Before you reply to anyone, take 10 slow breaths. Tap once for each breath.",card:()=>T("I pause before I reply. <strong>Gussa jayega, samajh rahegi.</strong>")}},
 {id:"sad",hi:"Mann udaas hai",en:"Feeling low",color:"#6c8fb3",sky:["#b4c4d8","#eef2f7"],
  open:"Krishna taught Arjuna that pain and happiness both pass. This is from Chapter 2.",
  ref:"Bhagavad Gita 2.14",
  dev:"मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः।<br>आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥",
  rom:"Matra sparshas tu kaunteya, shitoshna sukha duhkha dah. Agamapayino 'nityas, tans titikshasva bharata.",
  mean:"Heat and cold, happiness and pain, come from our contact with the world. They come and they go; they do not last. Bear them patiently, Arjuna.",

/* ---------- saved cards (this device only) ---------- */
function loadCards(){try{return JSON.parse(localStorage.getItem("mgh-cards")||"[]");}catch(e){return [];}}
function saveCards(c){try{localStorage.setItem("mgh-cards",JSON.stringify(c.slice(-30)));}catch(e){}}
let cards=loadCards();
const HELP_FULL_=()=>T(HELP_FULL_EN), HELP_QUIET_=()=>T(HELP_QUIET_EN);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");

const HELP_FULL_EN=`<div class="help"><strong>If you feel unsafe or are thinking of harming yourself</strong>, please talk to someone now. In the UK, call Samaritans free on <strong>116 123</strong>, any time. In India, call Tele-MANAS on <strong>14416</strong>. In an emergency, call 999 (UK) or 112 (India).</div>`;
const HELP_QUIET_EN=`<div class="help quiet">This app shares the Gita's wisdom. It isn't a replacement for talking to someone. If things feel very heavy, call <strong>Samaritans 116 123</strong> (UK) or <strong>Tele-MANAS 14416</strong> (India).</div>`;

/* ---------- home ---------- */
function feelings(msg){
  try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  const seen=new Set(cards.map(c=>c.id));
  app.innerHTML=`<div class="controls"><button class="ghost" id="toHome" type="button">${T("‹ Home")}</button></div>
   <div class="hero">${svg(sky("#fff6e6","#fff6e6")+`<circle cx="800" cy="520" r="330" fill="#ffe7a8"/>`+krishna(800,900,1.9,{flute:true}),"300 80 1000 820")}
     <div><h1>${T("Mann Ghabraya Hai?")}</h1><p class="lead">${msg||T("Batao, kya ho raha hai? Pick what you're feeling, and hear what Krishna said about it.")}</p></div></div>
   <div class="grid">${FEELINGS.map(f=>`<button class="feel${seen.has(f.id)?" done":""}" data-id="${f.id}" type="button"><span class="dot" style="background:${f.color}"></span><span class="hi">${T(f.hi)}</span><span class="en">${T(f.en)}</span></button>`).join("")}</div>
   ${cards.length?`<h2>${T("My cards")} <span class="tiny">${T(`(${cards.length}, saved on this device)`)}</span></h2><div class="cards">${cards.slice().reverse().slice(0,6).map(c=>`<div class="mini"><span class="r">${esc(TR(c.ref))}</span><span>${c.html}</span></div>`).join("")}</div>`:""}
   ${HELP_QUIET_()}`;

/* ---------- feeling journey ---------- */
let F=null, st={};
function open(id){
  F=FEELINGS.find(f=>f.id===id); st={taps:0,breaths:0,lit:false,cloud:"",gone:false};
  app.innerHTML=`
   <div class="controls"><button class="ghost" id="back" type="button">${T("‹ All feelings")}</button></div>
   <div class="stage" id="stage"></div>
   <div class="box" aria-live="polite"><span class="who" id="who">${T("Story")}</span><div id="say" class="say"></div><div class="act" id="act"></div></div>
   <div id="keep"></div>
   ${F.gentle?HELP_FULL_():""}`;
  document.getElementById("back").onclick=()=>feelings();
  draw(); step(0); window.scrollTo(0,0);
}
function draw(){
  const s=document.getElementById("stage"); if(!s) return;
  let el="", t=F.act.type;
  if(t==="count"){const r=Math.max(0,1-st.taps/10);
    el=`<g transform="translate(520 720)"><ellipse rx="160" ry="22" fill="#5a3a20" opacity=".35"/><g transform="scale(${.35+r*.85})"><path d="M0 -260 C110 -150 120 -40 0 0 C-120 -40 -110 -150 0 -260Z" fill="${r>0?"#e8552f":"#7cc6f0"}"/><path d="M0 -150 C50 -90 50 -30 0 -10 C-50 -30 -50 -90 0 -150Z" fill="${r>0?"#ffb347":"#d8f0fb"}"/></g></g>`;}
  if(t==="cloud"&&st.cloud){el=`<g class="${st.gone?"drift":""}"><g transform="translate(330 260)"><ellipse rx="210" ry="80" fill="#fff"/><ellipse cx="-100" cy="-45" rx="110" ry="70" fill="#fff"/><ellipse cx="100" cy="-40" rx="100" ry="62" fill="#fff"/><text y="14" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="54" fill="#6c8fb3">${esc(st.cloud).slice(0,18)}</text></g></g>`;}
  if(t==="diya") el=diya(520,760,1.6,st.lit,false);
  if(t==="breathe") el=diya(520,760,1.2+st.breaths*.25,true,st.breaths>=3);
  const dark=F.id==="grief"||F.id==="mind";
  s.innerHTML=svg(sky(F.sky[0],F.sky[1])+(dark?`<g fill="#fff" opacity=".7"><circle cx="200" cy="120" r="3"/><circle cx="420" cy="80" r="2"/><circle cx="1250" cy="140" r="3"/><circle cx="980" cy="60" r="2"/></g><rect y="720" width="1600" height="180" fill="#2a2246"/>`:hills("#9cc98a","#7fb36f"))
    +el+krishna(1120,840,1,{bless:true,glow:!!st.glow}));
}
function who(k){const w=document.getElementById("who");w.textContent=T(k==="K"?"Krishna's words":"Story");w.className="who"+(k==="K"?" K":"");}
function setSay(h){document.getElementById("say").innerHTML=T(h);}
function setAct(h){const a=document.getElementById("act");a.innerHTML=h||"";return a;}
function nextBtn(label,fn){const a=document.getElementById("act");const b=document.createElement("button");b.type="button";b.textContent=T(label);b.onclick=fn;a.appendChild(b);setTimeout(()=>{try{b.focus({preventScroll:true});}catch(e){}},30);return b;}

function step(n){
  if(n===0){who("N");setSay(F.open);setAct("");nextBtn("Hear Krishna's words",()=>step(1));}
  if(n===1){st.glow=true;draw();who("K");
    document.getElementById("say").innerHTML=`<div class="verse"><span class="ref">${TR(F.ref)}</span><div class="dev" lang="sa">${SCR(F.dev)}</div>${LANG==="en"?`<div class="rom">${F.rom}</div>`:""}<div class="mean">${T(F.mean)}</div></div>`;
    setAct("");nextBtn("What does it mean for me?",()=>step(2));}
  if(n===2){who("N");setSay(F.simple);setAct("");nextBtn("Let's try something",()=>step(3));}
  if(n===3){who("N");setSay(F.act.q);setAct("");ACT[F.act.type]();}
}
function finish(val){
  const html=F.act.card(esc(val||""));
  const card={id:F.id,ref:F.ref,html,when:Date.now()}; cards.push(card); saveCards(cards);
  who("N");setSay("Shabash. Keep this card and come back to it whenever you need.");setAct("");
  document.getElementById("keep").innerHTML=`<div class="keep">${LANG==="en"?`<div class="v">${F.rom.split(".")[0]}</div>`:`<div class="v" lang="sa">${SCR(F.dev.split("<br>")[0])}</div>`}<div class="m">${html}</div><div class="f">${TR(F.ref)}</div><div><button class="opt" type="button" id="copy">${T("Copy my card")}</button></div></div>`;
  document.getElementById("copy").onclick=function(){const txt=document.querySelector(".keep .m").innerText+"\n"+TR(F.ref);const b=this;
    try{navigator.clipboard.writeText(txt).then(()=>b.textContent=T("Copied"),()=>b.textContent=T("Select the text to copy"));}catch(e){b.textContent=T("Select the text to copy");}};
  nextBtn("I feel a little better",()=>mainHome(T("Jai Shri Krishna. Come back any time your mann ghabraye.")));
  const b=document.createElement("button");b.type="button";b.className="ghost";b.textContent=T("Something else is on my mind");b.onclick=()=>feelings();document.getElementById("act").appendChild(b);
}
const ACT={
  write(){const a=setAct(`<div class="field"><input id="inp" type="text" maxlength="90" placeholder="${esc(T(F.act.ph))}" aria-label="${T("Your answer")}"><button type="button" id="go">${T("Make my card")}</button></div>`);
    const go=()=>{const v=document.getElementById("inp").value.trim();if(!v){document.getElementById("inp").focus();return;}finish(v);};
    document.getElementById("go").onclick=go;document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
    setTimeout(()=>{try{document.getElementById("inp").focus({preventScroll:true});}catch(e){}},50);},
  count(){const b=nextBtn("Breath 1 of 10",()=>{st.taps++;draw();
      if(st.taps>=10){b.remove();setSay("Feel that? The fire has cooled. Now you can choose your words.");nextBtn("Make my card",()=>finish());}
      else b.textContent=T(`Breath ${st.taps+1} of 10`);});},
  cloud(){setAct(`<div class="field"><input id="inp" type="text" maxlength="18" placeholder="${esc(T(F.act.ph))}" aria-label="${T("Your feeling")}"><button type="button" id="go">${T("Put it in a cloud")}</button></div>`);
    const go=()=>{const v=document.getElementById("inp").value.trim();if(!v)return;st.cloud=v;draw();setAct("");setSay("There it is. It's real. Now watch it move.");
      nextBtn("Let it float away",function(){st.gone=true;draw();this.remove();setTimeout(()=>{setSay("The sky is still here. So are you.");nextBtn("Make my card",()=>finish());},2200);});};
    document.getElementById("go").onclick=go;document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")go();});},
  diya(){const b=nextBtn("Light the diya",()=>{st.lit=true;draw();b.remove();
      setAct(`<div class="field"><input id="inp" type="text" maxlength="60" placeholder="${esc(T(F.act.ph))}" aria-label="${T("Name or memory")}"><button type="button" id="go">${T("Make my card")}</button></div>`);
      const go=()=>finish(document.getElementById("inp").value.trim());document.getElementById("go").onclick=go;document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")go();});});},
  breathe(){const a=setAct(`<button type="button" class="hold" id="hold"><i></i><span>${T("Hold and breathe in")}</span></button>`);
    const b=document.getElementById("hold"),fill=b.querySelector("i"),lab=b.querySelector("span");let t0=0,raf=0,full=false;
    const tick=()=>{const p=Math.min(1,(performance.now()-t0)/3000);fill.style.width=p*100+"%";if(p>=1){full=true;lab.textContent=T("Now let go, breathe out");return;}raf=requestAnimationFrame(tick);};
    const down=e=>{e.preventDefault();full=false;t0=performance.now();lab.textContent=T("Breathing in…");raf=requestAnimationFrame(tick);};
    const up=()=>{if(!t0)return;t0=0;cancelAnimationFrame(raf);fill.style.width="0";
      if(full){st.breaths++;draw();if(st.breaths>=3){setAct("");setSay("See how the flame has gone still? So can the mind, a little at a time.");nextBtn("Make my card",()=>finish());return;}lab.textContent=T(`Good. Again (${st.breaths} of 3)`);}
      else lab.textContent=T("Hold a little longer");};
    b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointerleave",up);b.addEventListener("pointercancel",up);
    b.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)down(e);});b.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")up();});},
  choose(){F.act.opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=T(o);b.onclick=()=>finish(T(o));document.getElementById("act").appendChild(b);});}
};

window.openFeelings=feelings;window.mgCards=()=>loadCards();

  const n=window.mgCards?window.mgCards().length:0, dc=doneCount(), nx=nextChapter();

       <div class="prog" role="img" aria-label="${T(`${dc} of 18 chapters done`)}"><i style="width:${dc/18*100}%"></i></div>

   </div>

     <h2 id="todayH">${T("Today's verse")}</h2>

        :arjuna(600,800,.95,{sit:true,mood:"sad"})+`<g id="bowOnGround" style="cursor:pointer" transform="translate(380 790) rotate(-80)"><path d="M0 -130 Q80 0 0 130" fill="none" stroke="#8b4a1c" stroke-width="12" stroke-linecap="round"/><line x1="0" y1="-130" x2="0" y2="130" stroke="#5a3a20" stroke-width="3"/><circle r="150" fill="#f4a81d" opacity=".18" class="pulse"/></g>`)),
   steps:[
    {w:"N",t:"Krishna keeps talking, and slowly, Arjuna's doubt clears."},
    {w:"K",t:"<em>Uttho</em>, Arjuna! Do your duty."},
    {act:"bow",w:"N",q:"Help him up. Tap Arjuna's bow.",
     on:()=>[
      {w:"A",t:"My confusion is gone, Krishna. <em>Main taiyaar hoon.</em>"},
      {w:"N",t:"Arjuna's battle was outside. Ours is often inside."}]},
    {act:"duty",w:"K",q:"Now you. What is one thing you'll do today with your full heart, without worrying about the result?",
     on:()=>[{w:"N",t:"<em>Jab bhi mann ghabraye</em>, come back to your card. <em>Jai Shri Krishna.</em>"}]}
 ]}
],

 /* ===== Chapter 3: Karma Yoga ===== */
 3:(()=>{
  const day=(mA,extra,bless)=>svg(sky("#8fd0f2","#e6f6fc",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#7cc576","#5aa85a")+(extra||"")+krishna(1060,780,.95,{bless:bless!==false})+arjuna(620,780,.95,{mood:mA||"happy"}));
  return [
  {title:"Karma Yoga",sub:"Chapter 3 · The path of action",art:()=>day("happy"),steps:[
    {w:"N",t:"In Chapter 2, Krishna praised wisdom and a steady mind. Now Arjuna is confused."}]},
  {art:()=>day("sad"),steps:[
    {w:"A",t:"Krishna, if wisdom is better than action, why are you pushing me into this terrible battle? Your words confuse me."},
    {w:"K",t:"Arjuna, let me ask you something first. Can anyone truly stop acting?"},
    {act:"still",w:"N",q:"Try it. Press Start, then do nothing at all for 10 seconds.",
     on:()=>[{w:"N",t:"In those 10 seconds your heart beat about 12 times, you breathed two or three times, and your mind kept thinking. Even doing nothing is doing something."},
      {w:"K",t:V("Bhagavad Gita 3.5","न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत्।<br>कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः॥","Na hi kashchit kshanam api, jatu tishthaty akarma krit. Karyate hy avashah karma, sarvah prakriti jair gunaih.","No one can stay without acting, even for a moment. Everyone is driven to act by the qualities of nature.")},
      {w:"N",t:"So the question isn't whether to act. It's <em>how</em> to act."}]}
  ]},
  {art:()=>{let f="";for(let i=0;i<4;i++)f+=`<g transform="translate(${430-i*95} ${790+i*6}) scale(${.42-i*.03})">${arjuna(0,0,1,{mood:"happy"})}</g>`;
     return svg(sky("#ffd9a8","#fff3dd")+hills("#a6c97e","#86b062")+`<path d="M0 820 Q600 760 1200 800 T1600 790" stroke="#e0c08a" stroke-width="60" fill="none" opacity=".7"/>`+f+arjuna(700,790,.85,{mood:"happy"})+krishna(1180,790,.85,{bless:true}));},
   steps:[
    {w:"K",t:"People watch what you do, Arjuna, more than they listen to what you say."},
    {w:"K",t:V("Bhagavad Gita 3.21","यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः।<br>स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते॥","Yad yad acharati shreshthas, tat tad evetaro janah. Sa yat pramanam kurute, lokas tad anuvartate.","Whatever a great person does, others follow. Whatever standard they set, the world follows it.")},
    {act:"choice",w:"N",q:"Who learns from watching <em>you</em>?",opts:[["Children in my family","kids"],["My friends","friends"],["People at work","work"],["Everyone around me","all"]],
     on:()=>[{w:"N",t:"They're watching, even when you don't notice. Your actions teach them more than any lecture."}]}
  ]},
  {art:()=>{const f=[.5,.9,1.4,2][Math.min(3,S.flame||0)];
     return svg(sky("#3a2a4a","#7a4a5a")+`<rect y="700" width="1600" height="200" fill="#2a1d30"/>`+arjuna(1120,800,.9,{mood:(S.flame||0)>=3?"firm":"sad"})
      +`<g transform="translate(560 700) scale(${f})"><path d="M0 -160 C70 -90 75 -20 0 0 C-75 -20 -70 -90 0 -160Z" fill="${(S.flame||0)>=3?"#e8552f":"#f4a81d"}"/><path d="M0 -90 C30 -55 30 -15 0 -6 C-30 -15 -30 -55 0 -90Z" fill="#ffe08a"/></g>`);},
   steps:[
    {w:"A",t:"Then what makes people do wrong, Krishna, even when they don't want to?"},
    {w:"K",t:V("Bhagavad Gita 3.37","काम एष क्रोध एष रजोगुणसमुद्भवः।<br>महाशनो महापाप्मा विद्ध्येनमिह वैरिणम्॥","Kama esha krodha esha, rajo guna samudbhavah. Mahashano mahapapma, viddhy enam iha vairinam.","It is desire, and it turns into anger. It comes from restlessness, it is never satisfied, and it is the real enemy here.")},
    {act:"chain",w:"N",q:"Watch how it grows. Tap each step.",chain:["“I want it so badly…”","“I didn't get it.”","“Gussa!”"],
     on:()=>[{w:"N",t:"A small wish became a fire. Krishna's advice: notice desire early, while the flame is still small."}]}
  ]},
  {art:()=>day("firm"),steps:[
    {w:"K",t:"So do your work, Arjuna. Do it well, do it for the good of others, and don't be a slave to the result."},
    {act:"write",w:"K",q:"What's one good thing you'll do this week that someone could learn from?",ph:"e.g. Stay patient with my team, or help Mum without being asked",
     ref:"Bhagavad Gita 3.21",rom:"Yad yad acharati shreshthas, tat tad evetaro janah",card:v=>TF("This week I'll set an example: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"That's Karma Yoga. <em>Kaam karo, achha karo, sabke liye karo.</em>"}]}
  ]}];})(),

 /* ===== Chapter 4: Knowledge and action ===== */
 4:(()=>{
  const day=(mA,top)=>svg(sky("#9fd4f0","#eef8fd",top||`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#7cc576","#5aa85a")+krishna(1060,780,.95,{bless:true})+arjuna(620,780,.95,{mood:mA||"happy"}));
  return [
  {title:"Gyaan aur Karma",sub:"Chapter 4 · Knowledge and action",art:()=>day("happy"),steps:[
    {w:"N",t:"Now Krishna tells Arjuna that this wisdom is very, very old."}]},
  {art:()=>day("sad",`<circle cx="800" cy="200" r="130" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="10" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${800+160*Math.cos(a*Math.PI/180)}" y1="${200+160*Math.sin(a*Math.PI/180)}" x2="${800+200*Math.cos(a*Math.PI/180)}" y2="${200+200*Math.sin(a*Math.PI/180)}"/>`).join("")}</g>`),
   steps:[
    {w:"K",t:"Long ago, I taught this same yoga to Vivasvan, the sun god. He taught it to Manu, and Manu to King Ikshvaku. Over time, it was lost."},
    {w:"A",t:"But Krishna, you were born only recently, and the sun god lived long ago. How could you have taught him?"},
    {w:"K",t:"Arjuna, you and I have both been born many times. I remember all of those lives. You don't."}
  ]},
  {art:()=>S.light
     ? svg(sky("#ffcf8a","#fff3dd",`<circle cx="800" cy="560" r="260" fill="#fff1c1"/>`)+hills("#9cc98a","#7fb36f")+krishna(800,800,1.05,{bless:true,glow:true}))
     : svg(sky("#141026","#2a2448",`<g fill="#fff" opacity=".6"><circle cx="200" cy="120" r="3"/><circle cx="1250" cy="140" r="3"/><circle cx="980" cy="60" r="2"/></g>`)+`<rect y="660" width="1600" height="240" fill="#1a1530"/>`),
   steps:[
    {w:"K",t:"And whenever goodness fades in the world, I come back."},
    {w:"K",t:V("Bhagavad Gita 4.7–8","यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।<br>अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम्॥<br>परित्राणाय साधूनां विनाशाय च दुष्कृताम्।<br>धर्मसंस्थापनार्थाय सम्भवामि युगे युगे॥","Yada yada hi dharmasya, glanir bhavati bharata. Abhyutthanam adharmasya, tadatmanam srijamy aham. Paritranaya sadhunam, vinashaya cha dushkritam. Dharma samsthapanarthaya, sambhavami yuge yuge.","Whenever goodness declines and wrongdoing rises, I appear. To protect the good, to end wrongdoing and to restore what is right, I come, age after age.")},
    {act:"dawn",w:"N",q:"The world on screen has gone dark. Bring back the light.",
     on:()=>[{w:"N",t:"When things feel dark, this verse reminds people that darkness never has the last word."}]}
  ]},
  {art:()=>day("happy"),steps:[
    {w:"K",t:"How do you find this knowledge, Arjuna? Learn it from people who have seen the truth."},
    {w:"K",t:V("Bhagavad Gita 4.34","तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया।<br>उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः॥","Tad viddhi pranipatena, pariprashnena sevaya. Upadekshyanti te jnanam, jnaninas tattva darshinah.","Learn it by approaching the wise with humility, honest questions and service. Those who have seen the truth will teach you.")},
    {act:"choice",w:"N",q:"Who could <em>you</em> learn from?",opts:[["A teacher or elder","elder"],["A book or scripture","book"],["A friend who's been through it","friend"],["Someone at work","work"]],
     on:()=>[{w:"N",t:"Krishna's three keys for learning from them: be humble, ask honest questions, and help out."}]}
  ]},
  {art:()=>{const tangle=`<g fill="none" stroke="#6d5f80" stroke-width="7" stroke-linecap="round" opacity="${S.cut?.25:1}"><path d="M330 300 C420 180 540 420 620 300 S760 180 700 330 S520 470 450 360 S600 220 680 260"/><path d="M360 380 C470 260 560 470 640 380"/></g>`;
     const blade=S.cut?`<g transform="translate(520 330) rotate(-35)"><rect x="-8" y="-230" width="16" height="320" rx="8" fill="#e8f1f8" stroke="#9fb3c8" stroke-width="3"/><rect x="-40" y="90" width="80" height="16" rx="6" fill="#f4c430"/><rect x="-9" y="106" width="18" height="60" rx="6" fill="#8b4a1c"/></g>`:"";
     const word=S.doubt?`<text x="520" y="540" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="44" fill="#2b2140" opacity="${S.cut?.3:1}">${esc(S.doubt).slice(0,32)}</text>`:"";
     return svg(sky("#e6dcf0","#fbf7fd")+hills("#b6c9a6","#9cb58a")+tangle+word+blade+arjuna(1060,790,.9,{mood:S.cut?"firm":"sad",bow:!!S.cut}));},
   steps:[
    {w:"K",t:"Arjuna, the real problem now is doubt. A doubting mind finds no peace, here or anywhere."},
    {act:"cut",w:"N",q:"Type one doubt that holds you back.",ph:"e.g. I'm not good enough for this job",
     on:()=>[{w:"K",t:V("Bhagavad Gita 4.42","तस्मादज्ञानसम्भूतं हृत्स्थं ज्ञानासिनात्मनः।<br>छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत॥","Tasmad ajnana sambhutam, hrit stham jnanasinatmanah. Chhittvainam samshayam yogam, atishthottishtha bharata.","So with the sword of knowledge, cut through this doubt in your heart that comes from not knowing. Take up yoga, and stand up, Arjuna!")},
      {w:"N",t:"Knowledge doesn't answer every question. It lets you stand up and act anyway."}]}
  ]},
  {art:()=>day("firm"),steps:[
    {act:"write",w:"K",q:"What's one thing you'll learn this week to cut through a doubt?",ph:"e.g. One AWS topic, or how to cook one new dish",
     ref:"Bhagavad Gita 4.38 · Nothing in this world purifies like knowledge",rom:"Na hi jnanena sadrisham pavitram iha vidyate",card:v=>TF("To cut my doubt, this week I'll learn: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Gyaan se darr kam hota hai.</em> Knowledge makes fear smaller."}]}
  ]}];})(),

 /* ===== Chapter 5: Letting go while acting ===== */
 5:(()=>{
  const day=(mA,bless)=>svg(sky("#bfe3f2","#eef8fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:bless!==false})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const person=(robe,book)=>`<path d="M-40 0 L-30 -150 H30 L40 0Z" fill="${robe}"/><circle cy="-190" r="34" fill="#c98a5e"/><path d="M-34 -196 Q-34 -232 0 -232 Q34 -232 34 -196 Q24 -214 0 -214 Q-24 -214 -34 -196Z" fill="#1c1c2e"/>${book?`<rect x="-28" y="-120" width="56" height="40" rx="4" fill="#8b4a1c"/><line x1="0" y1="-120" x2="0" y2="-80" stroke="#f6eedf" stroke-width="3"/>`:""}`;
  const FIG={
   "A learned priest":person("#f4a81d",true),
   "A cow":`<g fill="#f4f0ea" stroke="#d8cfc2" stroke-width="3"><rect x="-90" y="-130" width="170" height="80" rx="36"/><rect x="-70" y="-60" width="16" height="60"/><rect x="-35" y="-60" width="16" height="60"/><rect x="25" y="-60" width="16" height="60"/><rect x="55" y="-60" width="16" height="60"/><ellipse cx="96" cy="-138" rx="32" ry="26"/></g><ellipse cx="-35" cy="-105" rx="24" ry="16" fill="#8b5a2b"/><ellipse cx="30" cy="-95" rx="16" ry="12" fill="#8b5a2b"/><path d="M80 -160 l-10 -22 M112 -160 l10 -22" stroke="#b5651d" stroke-width="6" stroke-linecap="round"/><circle cx="104" cy="-140" r="4" fill="#2b2140"/>`,
   "An elephant":`<g fill="#8f97a3"><ellipse cy="-115" rx="110" ry="75"/><rect x="-80" y="-60" width="34" height="60" rx="8"/><rect x="40" y="-60" width="34" height="60" rx="8"/><circle cx="100" cy="-150" r="56"/></g><ellipse cx="78" cy="-146" rx="30" ry="46" fill="#7a838f"/><path d="M140 -128 Q172 -70 150 -20" stroke="#8f97a3" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="118" cy="-160" r="5" fill="#2b2140"/>`,
   "A dog":`<g fill="#a0673a"><ellipse cy="-62" rx="56" ry="28"/><rect x="-42" y="-40" width="12" height="40"/><rect x="28" y="-40" width="12" height="40"/><circle cx="58" cy="-90" r="26"/></g><ellipse cx="50" cy="-98" rx="10" ry="20" fill="#7a4a24"/><path d="M-54 -70 q-30 -20 -24 -44" stroke="#a0673a" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="66" cy="-94" r="4" fill="#2b2140"/>`,
   "Someone others ignore":person("#8a8f99",false)};
  const names=Object.keys(FIG), xs=[150,400,660,910,1130];
  return [
  {title:"Karma Sanyasa Yoga",sub:"Chapter 5 · Letting go while acting",art:()=>day("happy"),steps:[
    {w:"N",t:"Arjuna has heard about giving up action, and about doing action. Now he's mixed up."}]},
  {art:()=>day("sad"),steps:[
    {w:"A",t:"Krishna, first you praise giving things up, then you praise doing your work. Tell me clearly. Which one is better?"},
    {w:"K",t:V("Bhagavad Gita 5.2","संन्यासः कर्मयोगश्च निःश्रेयसकरावुभौ।<br>तयोस्तु कर्मसंन्यासात्कर्मयोगो विशिष्यते॥","Sannyasah karma yogash cha, nihshreyasa karav ubhau. Tayos tu karma sannyasat, karma yogo vishishyate.","Giving up action and the yoga of action both lead to the highest good. But of the two, the yoga of action is better than giving up action.")},
    {w:"N",t:"In other words, you don't need to run away from your life. Stay in it, and change how you hold it."}
  ]},
  {art:()=>{const n=S.drops||0;let beads="";for(let i=0;i<n;i++)beads+=`<g class="grow"><ellipse cx="${330+i*90}" cy="${770+i*12}" rx="${40+i*10}" ry="10" fill="none" stroke="#e6f6fc" stroke-width="3"/><circle cx="${330+i*90}" cy="${760+i*12}" r="9" fill="#e6f6fc"/></g>`;
     return svg(sky("#bfe3f2","#eef8fd")+`<rect y="580" width="1600" height="320" fill="#5e9cc4"/>`+beads
      +`<g transform="translate(640 640)"><ellipse rx="260" ry="70" fill="#3e8a4a"/><g stroke="#2f6e39" stroke-width="5">${[-60,-30,0,30,60].map(a=>`<line x1="0" y1="0" x2="${240*Math.cos(a*Math.PI/180)}" y2="${-62*Math.sin(a*Math.PI/180)+20}"/>`).join("")}<line x1="0" y1="0" x2="-240" y2="0"/></g>${n?`<circle cx="150" cy="-30" r="14" fill="#e6f6fc" class="pulse"/>`:""}</g>`
      +`<g transform="translate(1010 650)" fill="#f28cb1"><path d="M0 -110 C40 -60 34 -10 0 0 C-34 -10 -40 -60 0 -110Z"/><path d="M-10 0 C-90 -10 -110 -60 -90 -70 C-50 -60 -20 -30 -10 0Z" opacity=".9"/><path d="M10 0 C90 -10 110 -60 90 -70 C50 -60 20 -30 10 0Z" opacity=".9"/></g>`
      +krishna(1330,840,.85,{bless:true}));},
   steps:[
    {w:"K",t:"Look at the lotus leaf, Arjuna. It lives in water all its life."},
    {act:"tapcount",key:"drops",n:3,w:"N",q:"Pour some water on the leaf and watch what happens.",label:i=>`Pour water (${i} of 3)`,
     on:()=>[{w:"N",t:"Every drop rolled straight off. The leaf sits in the water, but the water doesn't stick to it."},
      {w:"K",t:V("Bhagavad Gita 5.10","ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः।<br>लिप्यते न स पापेन पद्मपत्रमिवाम्भसा॥","Brahmany adhaya karmani, sangam tyaktva karoti yah. Lipyate na sa papena, padma patram ivambhasa.","Whoever acts while offering their work to the divine and letting go of attachment is not stained by wrong, just as a lotus leaf is not wet by water.")},
      {w:"N",t:"Do your work fully. Let praise, blame and worry roll off like water. <em>Kamal ke patte jaisa bano.</em>"}]}
  ]},
  {art:()=>{const seen=S.seen||[];
     return svg(sky("#ffe2b8","#fff6e6")+hills("#b6d39a","#9cc07f")
      +names.map((nm,i)=>`<g transform="translate(${xs[i]} 790) scale(.82)">${FIG[nm]}</g>`+(seen.includes(nm)?`<g transform="translate(${xs[i]} 548)" class="grow"><circle r="46" fill="#ffd36b" opacity=".35" class="pulse"/><path d="M0 -40 C18 -18 14 2 0 4 C-14 2 -18 -18 0 -40Z" fill="#f4a81d"/><path d="M0 -24 C7 -14 6 -2 0 0 C-6 -2 -7 -14 0 -24Z" fill="#fff1c9"/></g>`:"")).join("")
      +krishna(1430,860,.72,{bless:true,glow:seen.length>=names.length}));},
   steps:[
    {w:"K",t:"And a wise person sees the world differently."},
    {act:"collect",key:"seen",opts:names,w:"N",q:"Look at each one with Krishna's eyes. Tap them all.",
     on:()=>[{w:"N",t:"The same light shone in every one of them."},
      {w:"K",t:V("Bhagavad Gita 5.18","विद्याविनयसम्पन्ने ब्राह्मणे गवि हस्तिनि।<br>शुनि चैव श्वपाके च पण्डिताः समदर्शिनः॥","Vidya vinaya sampanne, brahmane gavi hastini. Shuni chaiva shvapake cha, panditah sama darshinah.","The wise see with an equal eye a learned and humble priest, a cow, an elephant, a dog, and a person society treats as an outcast.")},
      {w:"N",t:"<em>Sab mein wahi roshni hai.</em> Status, money and looks are on the outside. The light inside is the same."}]}
  ]},
  {art:()=>day("firm"),steps:[
    {w:"K",t:V("Bhagavad Gita 5.29","भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्।<br>सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति॥","Bhoktaram yajna tapasam, sarva loka maheshvaram. Suhridam sarva bhutanam, jnatva mam shantim richchhati.","Knowing Me as the one who receives all offerings and efforts, the great Lord of all the worlds, and the friend of all beings, a person finds peace.")},
    {w:"N",t:"<em>Suhridam sarva bhutanam</em>: the friend of all beings. That includes you."},
    {act:"write",w:"K",q:"Who is one person you'll try to see with an equal eye this week?",ph:"e.g. the cleaner at work, or a difficult neighbour",
     ref:"Bhagavad Gita 5.18",rom:"Panditah sama darshinah",card:v=>TF("This week I'll see the same light in: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Kaam bhi karo, aur dil bhi saaf rakho.</em> Do your work, and keep your heart clear."}]}
  ]}];})(),

 /* ===== Chapter 7: Knowing the divine ===== */
 7:(()=>{
  const day=(mA,glow)=>svg(sky("#f9d9a8","#fff3dd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#a6c97e","#86b062")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  return [
  {title:"Gyaan aur Vigyaan",sub:"Chapter 7 · Knowing the divine",art:()=>day("happy"),steps:[
    {w:"K",t:"Arjuna, now I'll tell you how to know Me fully. Not just with knowledge, but through experience."}]},
  {art:()=>{const n=S.pearls||0,pts=[];
     for(let i=0;i<7;i++){const t=(i+1)/8,x=(1-t)*(1-t)*200+2*(1-t)*t*800+t*t*1400,y=(1-t)*(1-t)*300+2*(1-t)*t*560+t*t*300;pts.push([x,y]);}
     return svg(sky("#3a2a5a","#7a5a8a",`<g fill="#fff" opacity=".6"><circle cx="200" cy="100" r="3"/><circle cx="1450" cy="90" r="2"/><circle cx="1000" cy="70" r="2"/></g>`)+`<rect y="760" width="1600" height="140" fill="#2a1d3d"/>`
      +`<path d="M200 300 Q800 820 1400 300" stroke="#f4c430" stroke-width="5" fill="none"/>`
      +pts.slice(0,n).map(([x,y])=>`<g class="grow"><circle cx="${x}" cy="${y}" r="36" fill="#fdf8f0"/><circle cx="${x-11}" cy="${y-12}" r="9" fill="#fff" opacity=".9"/><circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#e6dccf" stroke-width="3"/></g>`).join("")
      +krishna(800,900,.62,{bless:true,glow:n>=7}));},
   steps:[
    {w:"K",t:"Everything in this world is connected to Me."},
    {act:"tapcount",key:"pearls",n:7,w:"N",q:"Make a mala. Add seven pearls to the golden thread.",label:i=>`Add a pearl (${i} of 7)`,
     on:()=>[{w:"K",t:V("Bhagavad Gita 7.7","मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय।<br>मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव॥","Mattah parataram nanyat, kinchid asti dhananjaya. Mayi sarvam idam protam, sutre mani gana iva.","There is nothing higher than Me, Arjuna. Everything is strung on Me, like pearls on a thread.")},
      {w:"N",t:"The pearls all look separate, but one thread holds them together. We do too."}]}
  ]},
  {art:()=>{const f=S.found||[],ring=(x,y,r,k,up)=>f.includes(k)?`<g class="grow"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#f4c430" stroke-width="8" class="pulse"/><text x="${x}" y="${up?y-r-22:y+r+46}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="40" fill="#2b2140">${T("Main hoon")}</text></g>`:"";
     return svg(sky("#2f3f6a","#f2b37a")+hills("#8aa86f","#6f9258")
      +`<circle cx="250" cy="190" r="70" fill="#f6f1e1"/><circle cx="280" cy="170" r="62" fill="#3d4a73"/>`+ring(250,190,105,"Light of the moon")
      +`<circle cx="1360" cy="200" r="80" fill="#ffd36b"/>`+ring(1360,200,115,"Light of the sun")
      +`<ellipse cx="650" cy="780" rx="190" ry="50" fill="#5e9cc4"/><ellipse cx="610" cy="770" rx="60" ry="10" fill="#bfe3f2"/>`+ring(650,750,120,"Taste of water",true)
      +arjuna(1100,800,.6,{bow:true,mood:"firm"})+ring(1120,640,140,"Strength in people",true));},
   steps:[
    {w:"A",t:"But Krishna, where can I find You in everyday life?"},
    {act:"collect",key:"found",opts:["Taste of water","Light of the moon","Light of the sun","Strength in people"],w:"N",q:"Krishna is hiding in four places. Tap each one to find Him.",wait:1400,
     on:()=>[{w:"K",t:V("Bhagavad Gita 7.8","रसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः।<br>प्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु॥","Raso 'ham apsu kaunteya, prabhasmi shashi suryayoh. Pranavah sarva vedeshu, shabdah khe paurusham nrishu.","I am the taste in water, Arjuna, and the light of the moon and the sun. I am Om in all the Vedas, the sound in space, and the strength in people.")},
      {w:"N",t:"So the next time you drink a cool glass of water or see the moon, <em>Krishna wahin hain.</em>"}]}
  ]},
  {art:()=>day("happy",true),steps:[
    {w:"K",t:"Different people come to Me for different reasons, Arjuna."},
    {w:"K",t:V("Bhagavad Gita 7.16","चतुर्विधा भजन्ते मां जनाः सुकृतिनोऽर्जुन।<br>आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ॥","Chatur vidha bhajante mam, janah sukritino 'rjuna. Arto jijnasur artharthi, jnani cha bharatarshabha.","Four kinds of good people turn to Me, Arjuna: the one in distress, the one who is curious, the one who wants something, and the one who is wise.")},
    {act:"choice",w:"N",q:"Be honest. What brings <em>you</em> here today?",opts:[["I'm going through something hard","arto"],["I'm curious to learn","jijnasu"],["I'm hoping for something","artharthi"],["I want to understand life","jnani"]],
     on:()=>[{w:"K",t:"<em>Swagat hai.</em> Every one of these four is welcome. I don't turn anyone away."}]}
  ]},
  {art:()=>day("firm",true),steps:[
    {act:"write",w:"K",q:"Where did you notice something good, beautiful or strong today?",ph:"e.g. my mum's cooking, the sunrise, a kind stranger",
     ref:"Bhagavad Gita 7.8",rom:"Raso 'ham apsu kaunteya, prabhasmi shashi suryayoh",card:v=>TF("Today I saw Krishna's light in: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Dhoondho, toh har jagah milenge.</em> Look for Him, and you'll find Him everywhere."}]}
  ]}];})(),

 /* ===== Chapter 8: What we remember ===== */
 8:(()=>{
  const day=(mA)=>svg(sky("#c9e4f5","#f2f9fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const SEEDS={gratitude:"Gratitude",kindness:"Kindness",naam:"Krishna's name",worry:"Worry"};
  return [
  {title:"Akshara Brahma Yoga",sub:"Chapter 8 · What we remember",art:()=>svg(sky("#c9e4f5","#f2f9fd")+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true})+arjuna(620,780,.95,{mood:"sad"})
      +[[470,330],[560,250],[680,220],[800,260],[860,350],[420,420],[760,420]].map(([x,y],i)=>`<text x="${x}" y="${y}" font-family="Baloo 2,sans-serif" font-weight="800" font-size="${60+i*4}" fill="#d9534f" class="bob" style="animation-delay:${i*.3}s">?</text>`).join("")),
   steps:[
    {w:"N",t:"Arjuna has so many questions now. He asks Krishna seven of them, all in one breath."},
    {w:"A",t:"What is the eternal? What is the self? What is karma? … And Krishna, how can a person remember You at the very end of life?"},
    {w:"K",t:"That last question is the most important one, Arjuna. Listen."}]},
  {art:()=>svg(sky("#1d1b3a","#4a3a6a",`<g fill="#fff" opacity=".7"><circle cx="200" cy="120" r="3"/><circle cx="420" cy="80" r="2"/><circle cx="1250" cy="140" r="3"/><circle cx="1450" cy="90" r="2"/></g>`)+`<rect y="700" width="1600" height="200" fill="#2a2246"/>`
      +`<g transform="translate(560 720) scale(1.4)"><circle cy="-60" r="80" fill="#ffd36b" opacity=".25" class="pulse"/><path d="M-80 0 Q0 60 80 0 Z" fill="#d9622b"/><path d="M0 -80 C34 -40 28 0 0 4 C-28 0 -34 -40 0 -80Z" fill="#ffd36b" class="flick"/></g>`+krishna(1100,800,.9,{glow:true,bless:true})),
   steps:[
    {w:"K",t:V("Bhagavad Gita 8.6","यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम्।<br>तं तमेवैति कौन्तेय सदा तद्भावभावितः॥","Yam yam vapi smaran bhavam, tyajaty ante kalevaram. Tam tam evaiti kaunteya, sada tad bhava bhavitah.","Whatever a person remembers at the very end of life, that is where they go, Arjuna, because that is what they always thought about.")},
    {w:"N",t:"So the real practice isn't one special moment. It's every ordinary day. What we think about again and again slowly becomes who we are."}
  ]},
  {art:()=>{const w=S.water||0,bad=S.seed==="worry",h=w*36;
     const plant=w===0?"":bad
       ?`<g class="grow"><path d="M0 0 V${-h}" stroke="#6d6a62" stroke-width="10"/>${Array.from({length:w},(_,i)=>`<path d="M0 ${-30-i*34} l${i%2?34:-34} -18" stroke="#6d6a62" stroke-width="6"/><path d="M${i%2?34:-34} ${-48-i*34} l${i%2?8:-8} -10" stroke="#6d6a62" stroke-width="4"/>`).join("")}</g>`
       :`<g class="grow"><path d="M0 0 V${-h}" stroke="#3e7d3a" stroke-width="10"/>${Array.from({length:w},(_,i)=>`<ellipse cx="${i%2?30:-30}" cy="${-30-i*34}" rx="30" ry="13" fill="#4f9a48"/>`).join("")}${w>=5?`<g transform="translate(0 ${-h-20})"><circle r="40" fill="#f28cb1"/><circle r="16" fill="#f4c430"/></g>`:""}</g>`;
     return svg(sky("#c9e4f5","#f2f9fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")
      +`<g transform="translate(640 760)">${plant}<path d="M-110 0 L-85 120 H85 L110 0Z" fill="#c0622f"/><rect x="-120" y="-14" width="240" height="26" rx="8" fill="#d9773f"/>${S.seed?`<text y="80" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="34" fill="#fff6e6">${T(SEEDS[S.seed])}</text>`:""}</g>`
      +krishna(1150,800,.9,{bless:true}));},
   steps:[
    {act:"choice",w:"N",q:"Think of your mind as a garden. Which seed will you water every day?",opts:[["Gratitude","gratitude"],["Kindness","kindness"],["Krishna's name","naam"],["Worry","worry"]],
     on:k=>{S.seed=k;return [{w:"N",t:k==="worry"?"Interesting choice. Let's see what grows.":"Lovely choice. Let's see what grows."}];}},
    {act:"tapcount",key:"water",n:5,w:"N",q:"Water it every day for five days.",label:i=>`Water it (day ${i+1} of 5)`,
     on:()=>[{w:"N",t:()=>S.seed==="worry"?"Worry grew too, all thorns and no flowers. Whatever we water, grows. Next time, try a different seed.":"Five days of watering, and look: a flower. Whatever we water, grows."}]}
  ]},
  {art:()=>svg(sky("#ffcf8a","#fff3dd",`<circle cx="800" cy="380" r="140" fill="#fff1c1"/>`)+hills("#9bb08f","#7c9a6c")+krishna(1080,800,.95,{bless:true})+arjuna(600,800,.95,{bow:true,mood:"firm"})),
   steps:[
    {w:"K",t:V("Bhagavad Gita 8.7","तस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च।<br>मय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयः॥","Tasmat sarveshu kaleshu, mam anusmara yudhya cha. Mayy arpita mano buddhir, mam evaishyasy asamshayah.","So at all times, remember Me, and fight. With your mind and understanding given to Me, you will surely come to Me.")},
    {w:"N",t:"Notice the words <em>“anusmara yudhya cha”</em>: remember Me, <em>and</em> fight. Krishna doesn't ask Arjuna to leave his work to remember God. He asks him to do both together."},
    {act:"write",w:"K",q:"What's one good thought you'll come back to every day?",ph:"e.g. I am doing my best, and that is enough",
     ref:"Bhagavad Gita 8.7",rom:"Mam anusmara yudhya cha",card:v=>TF("Every day I'll water this thought: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Jo roz sochoge, wahi banoge.</em> What you think every day, you become."}]}
  ]}];})(),

 /* ===== Chapter 9: The royal secret ===== */
 9:(()=>{
  const day=(mA,glow)=>svg(sky("#ffe2b8","#fff6e6",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#b6d39a","#9cc07f")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const ITEM={leaf:`<path d="M-60 0 Q0 -90 60 0 Q0 30 -60 0Z" fill="#4f9a48"/><path d="M-50 0 Q0 -10 55 -2" stroke="#2f6e39" stroke-width="4" fill="none"/>`,
    flower:`<g fill="#f28cb1"><circle cx="0" cy="-40" r="22"/><circle cx="-26" cy="-22" r="22"/><circle cx="26" cy="-22" r="22"/><circle cx="-16" cy="6" r="22"/><circle cx="16" cy="6" r="22"/></g><circle cy="-14" r="14" fill="#f4c430"/>`,
    fruit:`<circle cy="-30" r="42" fill="#f08a24"/><path d="M0 -72 q6 -20 22 -24" stroke="#5a3a20" stroke-width="6" fill="none"/><ellipse cx="22" cy="-94" rx="16" ry="8" fill="#4f9a48"/>`,
    water:`<path d="M-40 -70 H40 L30 0 H-30Z" fill="#c9a24a"/><ellipse cy="-70" rx="40" ry="10" fill="#7cc6f0"/>`};
  const BURDEN=["Money worries","Exams or work","Family problems","Health","Fear of the future"];
  return [
  {title:"Raja Vidya",sub:"Chapter 9 · The royal secret",art:()=>day("happy"),steps:[
    {w:"K",t:"Arjuna, now I'll share the most secret and royal knowledge. And the best part? It's easy and joyful to practise."}]},
  {art:()=>svg(sky("#ffe2b8","#fff6e6")+hills("#b6d39a","#9cc07f")
      +`<g transform="translate(620 760)"><ellipse rx="170" ry="34" fill="#d4a017"/><ellipse rx="140" ry="24" fill="#f4c430"/>${S.offer?`<g class="grow" transform="translate(0 -6)">${ITEM[S.offer]}</g>`:""}</g>`
      +krishna(1080,800,.95,{bless:true,glow:!!S.offer})),
   steps:[
    {w:"K",t:"You don't need gold or grand rituals to reach Me."},
    {act:"choice",w:"N",q:"If you could offer Krishna something right now, what would it be?",opts:[["A leaf","leaf"],["A flower","flower"],["A fruit","fruit"],["Some water","water"]],
     on:k=>{S.offer=k;return [
      {w:"K",t:V("Bhagavad Gita 9.26","पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति।<br>तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः॥","Patram pushpam phalam toyam, yo me bhaktya prayachchhati. Tad aham bhakty upahritam, ashnami prayatatmanah.","Whoever offers Me a leaf, a flower, a fruit or water with love, I accept that offering of love from a pure heart.")},
      {w:"N",t:"Krishna doesn't measure the gift. He looks at the love inside it. <em>Bhaav dekhte hain, bhent nahi.</em>"}];}}
  ]},
  {art:()=>{const g=S.given||[],left=BURDEN.filter(b=>!g.includes(b));
     const sack=(x,y,t,glow)=>`<g transform="translate(${x} ${y})">${glow?`<circle cy="-40" r="70" fill="#fff3b0" opacity=".6"/>`:""}<path d="M-70 0 Q-80 -70 -30 -86 L-18 -100 H18 L30 -86 Q80 -70 70 0Z" fill="#a8763e"/><rect x="-22" y="-102" width="44" height="12" rx="5" fill="#6b4a2c"/><text y="-30" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="22" fill="#fff6e6">${T(t)}</text></g>`;
     return svg(sky("#c9e4f5","#f2f9fd")+hills("#9cc98a","#7fb36f")
      +left.map((b,i)=>sack(150+(i%3)*160,800-Math.floor(i/3)*110,b,false)).join("")
      +arjuna(700,800,.85,{mood:left.length?"sad":"happy"})
      +g.map((b,i)=>sack(1240+(i%3)*120,860-Math.floor(i/3)*90,b,true).replace(/translate\(([\d.]+) ([\d.]+)\)/,(m,x,y)=>`translate(${x} ${y}) scale(.7)`)).join("")
      +krishna(1080,800,.85,{bless:true}));},
   steps:[
    {w:"N",t:"Everyone carries something heavy. Arjuna does too."},
    {act:"collect",key:"given",opts:BURDEN,w:"N",q:"Hand each heavy bag to Krishna.",
     on:()=>[{w:"K",t:V("Bhagavad Gita 9.22","अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते।<br>तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्॥","Ananyash chintayanto mam, ye janah paryupasate. Tesham nityabhiyuktanam, yoga kshemam vahamy aham.","For those who think of Me with full devotion and always stay connected to Me, I bring what they lack and protect what they have.")},
      {w:"N",t:"You still do your part, just like Arjuna. But you don't have to carry it all alone. <em>Bojh baant lo.</em>"}]}
  ]},
  {art:()=>day("happy",true),steps:[
    {w:"A",t:"Krishna, what about people who've made big mistakes? Are they still welcome?"},
    {w:"K",t:V("Bhagavad Gita 9.31","क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति।<br>कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति॥","Kshipram bhavati dharmatma, shashvach chhantim nigachchhati. Kaunteya pratijanihi, na me bhaktah pranashyati.","They soon become good-hearted and find lasting peace. Arjuna, declare it boldly: My devotee is never lost.")},
    {w:"N",t:"No past is too heavy for a fresh start. <em>Kabhi bhi shuru kar sakte ho.</em>"}
  ]},
  {art:()=>day("firm",true),steps:[
    {act:"write",w:"K",q:"What's one ordinary thing you'll do today as an offering to Krishna?",ph:"e.g. cooking dinner, or my shift at work",
     ref:"Bhagavad Gita 9.27",rom:"Yat karoshi yad ashnasi … tat kurushva mad arpanam",card:v=>TF("Today I offer to Krishna: <strong>{v}</strong>",v),
     on:()=>[{w:"K",t:"Whatever you do, eat, give or work hard at, do it as an offering to Me (9.27)."},
      {w:"N",t:"Then even washing dishes becomes a prayer. <em>Har kaam pooja ban sakta hai.</em>"}]}
  ]}];})(),

 /* ===== Chapter 10: Krishna's glories ===== */
 10:(()=>{
  const day=(mA,glow)=>svg(sky("#d6c3ec","#f6effc",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#a9c99a","#8fb47f")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const G=[["Among mountains","the Himalaya","10.25",`<path d="M-50 20 L0 -50 L50 20Z" fill="#8fa9c9"/><path d="M-16 -28 L0 -50 L16 -28 L6 -22 L0 -30 L-6 -22Z" fill="#fff"/>`],
    ["Among rivers","the Ganga","10.31",`<path d="M-50 -20 q25 -18 50 0 t50 0 M-50 4 q25 -18 50 0 t50 0" stroke="#3f7fd0" stroke-width="9" fill="none" stroke-linecap="round"/>`],
    ["Among trees","the peepal tree","10.26",`<rect x="-7" y="-10" width="14" height="34" fill="#8b4a1c"/><circle cy="-26" r="34" fill="#4f9a48"/>`],
    ["Among seasons","spring","10.35",`<g fill="#f28cb1"><circle cy="-18" r="14"/><circle cx="-16" cy="-6" r="14"/><circle cx="16" cy="-6" r="14"/><circle cx="-10" cy="12" r="14"/><circle cx="10" cy="12" r="14"/></g><circle r="10" fill="#f4c430"/>`],
    ["Among the Pandavas","Arjuna!","10.37",`<path d="M-10 -50 Q40 0 -10 50" fill="none" stroke="#8b4a1c" stroke-width="8" stroke-linecap="round"/><line x1="-10" y1="-50" x2="-10" y2="50" stroke="#5a3a20" stroke-width="2"/>`]];
  const pos=[[110,140],[480,140],[850,140],[295,370],[665,370]];
  return [
  {title:"Vibhuti Yoga",sub:"Chapter 10 · Krishna's glories",art:()=>day("happy"),steps:[
    {w:"A",t:"Krishna, you are everywhere, but my mind needs something to hold on to. Where should I look for You?"}]},
  {art:()=>day("happy",true),steps:[
    {w:"K",t:V("Bhagavad Gita 10.20","अहमात्मा गुडाकेश सर्वभूताशयस्थितः।<br>अहमादिश्च मध्यं च भूतानामन्त एव च॥","Aham atma gudakesha, sarva bhutashaya sthitah. Aham adish cha madhyam cha, bhutanam anta eva cha.","I am the Self in the heart of every being, Arjuna. I am the beginning, the middle and the end of all beings.")},
    {w:"K",t:"But since you asked, I'll tell you where I shine the brightest."}
  ]},
  {art:()=>{const o=S.open||[];
     return svg(sky("#d6c3ec","#f6effc")+hills("#a9c99a","#8fb47f")
      +G.map(([a,b,r,ic],i)=>{const [x,y]=pos[i],on=o.includes(a);
        return `<g transform="translate(${x} ${y})"><rect width="340" height="180" rx="22" fill="${on?"#fff3d6":"#ffffff"}" stroke="${on?"#f4a81d":"#e2d6ee"}" stroke-width="5"/><text x="170" y="44" text-anchor="middle" font-family="Mukta,sans-serif" font-weight="600" font-size="28" fill="#6d5f80">${T(a)}…</text>${on?`<g class="grow"><g transform="translate(52 112) scale(.8)">${ic}</g><text x="100" y="124" font-family="Baloo 2,sans-serif" font-weight="800" font-size="${b.length>12?27:32}" fill="#2b2140">${T(b)}</text><text x="322" y="166" text-anchor="end" font-family="Mukta,sans-serif" font-size="20" fill="#6d5f80">${r}</text></g>`:`<text x="170" y="128" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="64" fill="#e2d6ee">?</text>`}</g>`;}).join("")
      +arjuna(1060,860,.55,{mood:o.includes("Among the Pandavas")?"firm":"happy"})+krishna(1380,860,.7,{bless:true,glow:o.length>=5}));},
   steps:[
    {act:"collect",key:"open",opts:G.map(g=>g[0]),w:"N",q:"Krishna says, “Among all things, I am the best.” Tap each card to see.",wait:1300,
     on:()=>[{w:"A",t:"Wait… among the Pandavas, You are <em>me</em>?"},
      {w:"K",t:"Yes, Arjuna. Your courage, your skill, your good heart: they're My spark shining in you."},
      {w:"K",t:V("Bhagavad Gita 10.41","यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा।<br>तत्तदेवावगच्छ त्वं मम तेजोंऽशसम्भवम्॥","Yad yad vibhutimat sattvam, shrimad urjitam eva va. Tat tad evavagachchha tvam, mama tejo 'msha sambhavam.","Whatever is glorious, beautiful or strong, know that it comes from just a spark of My splendour.")}]}
  ]},
  {art:()=>day("firm",true),steps:[
    {w:"N",t:"If Krishna's spark shines in Arjuna, it shines in you too."},
    {act:"write",w:"K",q:"What's one good quality in you that could be Krishna's spark?",ph:"e.g. my patience, my cooking, how I listen to people",
     ref:"Bhagavad Gita 10.41",rom:"Mama tejo 'msha sambhavam",card:v=>TF("A spark of Krishna in me: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Apni roshni ko chhota mat samjho.</em> Don't think your light is small."}]}
  ]}];})(),

 /* ===== Chapter 11: The universal form ===== */
 11:(()=>{
  const day=(mA,glow)=>svg(sky("#bfe3f2","#eef8fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true,glow:!!glow,flute:!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const stars=n=>{let g="";for(let i=0;i<n;i++){const x=(i*397)%1600,y=(i*233)%900,r=1+(i%3);g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.4+(i%5)/10}"/>`;}return g;};
  function cosmic(suns){
    const arms=[[-180,-400],[-230,-310],[-230,-210],[-185,-120],[180,-400],[230,-310],[230,-210],[185,-120]];
    const items=[`<g fill="#fff"><path d="M-14 -12 Q0 -30 14 -12 Q20 6 0 18 Q-20 6 -14 -12Z"/></g>`,`<g fill="#f28cb1"><path d="M0 -26 C12 -10 10 6 0 10 C-10 6 -12 -10 0 -26Z"/></g>`,"","",
      `<g stroke="#f4c430" stroke-width="4" fill="none"><circle r="22"/>${[0,45,90,135].map(a=>`<line x1="${-22*Math.cos(a*Math.PI/180)}" y1="${-22*Math.sin(a*Math.PI/180)}" x2="${22*Math.cos(a*Math.PI/180)}" y2="${22*Math.sin(a*Math.PI/180)}"/>`).join("")}</g>`,`<rect x="-5" y="-40" width="10" height="44" fill="#d4a017"/><circle cy="-44" r="14" fill="#f4c430"/>`,"",""];
    let a="";arms.forEach(([x,y],i)=>{a+=`<path d="M${x<0?-40:40} -215 Q${x*.6} ${(y-215)/2} ${x} ${y}" stroke="#3f7fd0" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="${x}" cy="${y}" r="14" fill="#3f7fd0"/><g transform="translate(${x} ${y-10})">${items[i]}</g>`;});
    let rays="";for(let i=0;i<24;i++){const t=i*15*Math.PI/180;rays+=`<line x1="${170*Math.cos(t)}" y1="${-290+170*Math.sin(t)}" x2="${(260+(i%2)*60)*Math.cos(t)}" y2="${-290+(260+(i%2)*60)*Math.sin(t)}" stroke="#ffd36b" stroke-width="8" stroke-linecap="round" opacity=".8"/>`;}
    let sn="";for(let i=0;i<suns;i++){const t=(i/Math.max(suns,1))*Math.PI*2-Math.PI/2;sn+=`<g class="grow"><circle cx="${420*Math.cos(t)}" cy="${-290+330*Math.sin(t)}" r="44" fill="#ffd36b"/><circle cx="${420*Math.cos(t)}" cy="${-290+330*Math.sin(t)}" r="62" fill="#ffd36b" opacity=".3" class="pulse"/></g>`;}
    return `<g transform="translate(800 900) scale(1.15)"><circle cy="-290" r="${200+suns*30}" fill="#fff3b0" opacity="${.15+suns*.08}"/>${sn}${rays}<g class="bob">${a}</g>${krishna(0,0,1,{glow:false})}</g>`;
  }
  return [
  {title:"Vishwarupa Darshana",sub:"Chapter 11 · The universal form",art:()=>day("happy"),steps:[
    {w:"N",t:"Arjuna has heard Krishna say He is everything. Now he has one wish."}]},
  {art:()=>S.eyes
      ? svg(`<rect width="1600" height="900" fill="#120e2a"/>`+stars(120)+`<circle cx="300" cy="200" r="160" fill="#5a3a8a" opacity=".35"/><circle cx="1300" cy="650" r="220" fill="#1f8a8a" opacity=".25"/>`+cosmic(0)+arjuna(220,880,.5,{sit:true,mood:"sad"}))
      : day("happy"),
   steps:[
    {w:"A",t:"Krishna, if I'm able to see it, please show me Your divine, universal form."},
    {w:"K",t:V("Bhagavad Gita 11.8","न तु मां शक्यसे द्रष्टुमनेनैव स्वचक्षुषा।<br>दिव्यं ददामि ते चक्षुः पश्य मे योगमैश्वरम्॥","Na tu mam shakyase drashtum, anenaiva sva chakshusha. Divyam dadami te chakshuh, pashya me yogam aishvaram.","You can't see Me with these ordinary eyes. I'll give you divine eyes. Now see My divine power!")},
    {act:"dawn",label:"Open your divine eyes",flag:"eyes",w:"N",q:"Take a breath, then open your divine eyes.",
     on:()=>[{w:"N",t:"Arjuna gasps. Krishna is suddenly vast, with countless arms, faces and eyes, filling the whole sky."}]}
  ]},
  {art:()=>svg(`<rect width="1600" height="900" fill="#120e2a"/>`+stars(120)+`<circle cx="300" cy="200" r="160" fill="#5a3a8a" opacity=".35"/><circle cx="1300" cy="650" r="220" fill="#1f8a8a" opacity=".25"/>`+cosmic(S.suns||0)+arjuna(220,880,.5,{sit:true,mood:"sad"})),
   steps:[
    {act:"tapcount",key:"suns",n:8,w:"N",q:"How bright was it? Light up the sky.",label:i=>`Light a sun (${i} of 8)`,
     on:()=>[{w:"N",t:"Even eight suns can't come close."},
      {w:"N",t:V("Bhagavad Gita 11.12","दिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता।<br>यदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः॥","Divi surya sahasrasya, bhaved yugapad utthita. Yadi bhah sadrishi sa syad, bhasas tasya mahatmanah.","If a thousand suns rose in the sky at the same moment, that light might come close to the splendour of that great Being.")}]}
  ]},
  {art:()=>S.gentle
      ? svg(sky("#ffd9a8","#fff3dd",`<circle cx="800" cy="360" r="150" fill="#fff1c1"/>`)+hills("#a6c97e","#86b062")+krishna(1000,800,.95,{flute:true})+arjuna(620,800,.95,{mood:"happy"}))
      : svg(`<rect width="1600" height="900" fill="#120e2a"/>`+stars(120)+cosmic(8)+arjuna(220,880,.5,{sit:true,mood:"sad"})),
   steps:[
    {w:"A",t:V("Bhagavad Gita 11.45","अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा भयेन च प्रव्यथितं मनो मे।<br>तदेव मे दर्शय देव रूपं प्रसीद देवेश जगन्निवास॥","Adrishta purvam hrishito 'smi drishtva, bhayena cha pravyathitam mano me. Tad eva me darshaya deva rupam, prasida devesha jagan nivasa.","I'm thrilled to see what no one has seen before, but my mind is shaking with fear. Please show me Your familiar form again, Lord. Be kind, home of the universe.")},
    {act:"dawn",label:"Ask Krishna to come back as a friend",flag:"gentle",w:"N",q:"Arjuna is overwhelmed. Help him.",
     on:()=>[{w:"N",t:"And there He is again: the smiling Krishna with His flute, standing next to His friend."},
      {w:"N",t:"The Krishna who holds the whole universe is the same Krishna who stands beside you. <em>Itne bade, phir bhi itne paas.</em> So big, and yet so close."}]}
  ]},
  {art:()=>day("firm"),steps:[
    {w:"K",t:V("Bhagavad Gita 11.54","भक्त्या त्वनन्यया शक्य अहमेवंविधोऽर्जुन।<br>ज्ञातुं द्रष्टुं च तत्त्वेन प्रवेष्टुं च परन्तप॥","Bhaktya tv ananyaya shakya, aham evam vidho 'rjuna. Jnatum drashtum cha tattvena, praveshtum cha parantapa.","Only through wholehearted love can I be known like this, Arjuna, truly seen, and become one with.")},
    {w:"N",t:"Not by cleverness, money or power. Only love opens this door."},
    {act:"write",w:"K",q:"When do you feel closest to Krishna, or most at peace?",ph:"e.g. at the mandir, singing bhajans, walking in nature",
     ref:"Bhagavad Gita 11.54",rom:"Bhaktya tv ananyaya shakya",card:v=>TF("I feel closest to Krishna when: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"Go there more often. <em>Wahi aapka mandir hai.</em> That's your temple."}]}
  ]}];})(),

 /* ===== Chapter 12: Devotion ===== */
 12:(()=>{
  const day=(mA,glow)=>svg(sky("#ffd6e2","#fff3f6",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#a9d19a","#8bbd7a")+krishna(1060,780,.95,{bless:true,glow:!!glow,flute:!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const LV=[
   {t:"First, Krishna says: <em>“Fix your mind on Me completely.”</em> (12.8)",yes:"I can try this",reply:"Then keep your mind on Me, and you'll live in Me. No doubt about it."},
   {t:"<em>“If you can't keep your mind on Me steadily, then practise. A little every day.”</em> (12.9)",yes:"I can practise a little",reply:"Wonderful. Small daily practice is how every great devotee began."},
   {t:"<em>“If even practice is hard, then simply do your work for My sake.”</em> (12.10)",yes:"I can do my work for Krishna",reply:"That's enough to reach Me. Your everyday work becomes your worship."},
   {t:"<em>“And if even that is too much, just do your best and let go of the results.”</em> (12.11)",yes:"Yes, I can do this",reply:"Then you're still on My path. There is always a step you can take."}];

  {title:"Bhakti Yoga",sub:"Chapter 12 · The path of love",art:()=>day("happy"),steps:[
    {w:"N",t:"This is one of the shortest chapters, and one of the most loved. It's all about bhakti: love for God."}]},
  {art:()=>day("happy",true),steps:[
    {w:"A",t:"Krishna, some people love You in this form, and some meditate on the formless, unseen truth. Who is better?"},
    {w:"K",t:"Those who fix their minds on Me with love and faith are the most connected to Me. The formless path is much harder for people with a body."},
    {w:"K",t:V("Bhagavad Gita 12.8","मय्येव मन आधत्स्व मयि बुद्धिं निवेशय।<br>निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः॥","Mayy eva mana adhatsva, mayi buddhim niveshaya. Nivasishyasi mayy eva, ata urdhvam na samshayah.","Keep your mind on Me alone, and rest your understanding in Me. Then you will live in Me. There is no doubt.")}
  ]},
  {art:()=>{const r=S.rung||0,ys=[260,420,580,740];
     return svg(sky("#ffd6e2","#fff3f6")+hills("#a9d19a","#8bbd7a")
      +`<g stroke="#8b4a1c" stroke-width="16" stroke-linecap="round"><line x1="560" y1="880" x2="700" y2="180"/><line x1="760" y1="880" x2="900" y2="180"/></g>`
      +ys.map((y,i)=>{const x1=560+(880-y)/700*140,x2=x1+200;return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${i===r?"#f4a81d":"#a8763e"}" stroke-width="${i===r?18:12}" stroke-linecap="round"/>`;}).join("")
      +arjuna(560+(880-ys[r])/700*140+100,ys[r],.42,{mood:"happy"})
      +krishna(1150,820,.9,{bless:true,glow:true})
      +`<text x="1150" y="140" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="40" fill="#6d5f80">${T("Krishna's ladder")}</text>`);},
   steps:[
    {w:"N",t:"Then Krishna does something beautiful. He gives a ladder of steps, so that <em>everyone</em> can find one they can manage."},
    {act:"ladder",levels:LV,w:"K",q:"",on:L=>[{w:"K",t:L.reply},{w:"N",t:"Notice that Krishna never says “give up”. There's always a step for you. <em>Har kisi ke liye ek seedhi hai.</em>"}]}
  ]},
  {art:()=>{const g=S.garland||[];let f="";
     g.forEach((q,i)=>{const t=(i+1)/(Q.length+1),x=380+t*840,y=180+Math.sin(t*Math.PI)*330;
       f+=`<g class="grow" transform="translate(${x} ${y})"><g fill="${["#f28cb1","#f4a81d","#e05a47","#c38cf2","#f6eedf"][i]}"><circle cy="-20" r="20"/><circle cx="-19" cy="-6" r="20"/><circle cx="19" cy="-6" r="20"/><circle cx="-12" cy="16" r="20"/><circle cx="12" cy="16" r="20"/></g><circle r="11" fill="#f4c430"/><text y="66" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="28" fill="#2b2140" stroke="#fff3f6" stroke-width="8" paint-order="stroke">${T(q)}</text></g>`;});
     return svg(sky("#ffd6e2","#fff3f6")+hills("#a9d19a","#8bbd7a")+`<path d="M380 180 Q800 840 1220 180" stroke="#3e8a4a" stroke-width="5" fill="none"/>`+f+krishna(800,900,.62,{bless:true,glow:g.length>=Q.length}));},
   steps:[
    {w:"K",t:"And here are the qualities of the people who are most dear to Me."},
    {act:"collect",key:"garland",opts:Q,w:"N",q:"Make Krishna a garland. Tap each quality to add a flower.",
     on:()=>[{w:"K",t:V("Bhagavad Gita 12.13","अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च।<br>निर्ममो निरहङ्कारः समदुःखसुखः क्षमी॥","Adveshta sarva bhutanam, maitrah karuna eva cha. Nirmamo nirahankarah, sama duhkha sukhah kshami.","One who hates no living being, who is friendly and kind, not possessive, without ego, steady in pain and pleasure, and forgiving…")},
