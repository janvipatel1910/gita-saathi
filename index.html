  {art:()=>day("firm",true),steps:[
    {act:"write",w:"K",q:"Which flower from the garland will you practise this week? How?",ph:"e.g. Forgiving: I'll let go of last week's argument",
     ref:"Bhagavad Gita 12.13–14",rom:"Maitrah karuna eva cha … sa me priyah",card:v=>TF("This week, for Krishna: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Pyaar hi sabse seedha raasta hai.</em> Love is the most direct path."}]}
  ]}];})(),

 /* ===== Chapter 13: The field and the knower ===== */
 13:(()=>{
  const day=(mA)=>svg(sky("#c9e4f5","#f2f9fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const P=["Tired body","Worried thoughts","Old memories","Today's pain"];
  const pl=[[190,470],[590,470],[150,650],[590,650]];
  const R=(n)=>`Bhagavad Gita 13.${n} <span style="text-transform:none;letter-spacing:0">(13.${n-1} in some editions)</span>`;
  return [
  {title:"Kshetra aur Kshetragya",sub:"Chapter 13 · The field and the knower",art:()=>day("happy"),steps:[
    {w:"A",t:"Krishna, I want to understand. What is the field, and who is the one who knows the field?"}]},
  {art:()=>{const n=S.noticed||[];
     return svg(sky("#c9e4f5","#f2f9fd")+`<circle cx="560" cy="160" r="${n.length?90+n.length*14:70}" fill="#ffe28a"/>${n.length?`<circle cx="560" cy="160" r="${130+n.length*20}" fill="#ffe28a" opacity=".3" class="pulse"/>`:""}`
      +`<rect y="400" width="1600" height="500" fill="#9cc98a"/>`
      +P.map((p,i)=>{const [x,y]=pl[i],on=n.includes(p);
        return `<g transform="translate(${x} ${y})">${on?`<path d="M${370-x+80} ${160-y+60} L0 0 L360 0 Z" fill="#fff3b0" opacity=".35"/>`:""}<rect width="360" height="150" rx="10" fill="${on?"#c7e3a8":"#8a6a3a"}" stroke="#6b4a2c" stroke-width="4"/>${[30,70,110].map(yy=>`<path d="M20 ${yy} H340" stroke="${on?"#7fb36f":"#6b4a2c"}" stroke-width="6" stroke-dasharray="14 10"/>`).join("")}<rect x="35" y="48" width="290" height="54" rx="27" fill="#fff6e6"/><text x="180" y="85" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="30" fill="#2b2140">${T(p)}</text></g>`;}).join("")
      +arjuna(1250,860,.85,{mood:n.length>=P.length?"firm":"happy"}));},
   steps:[
    {w:"K",t:V(R(2),"इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते।<br>एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः॥","Idam shariram kaunteya, kshetram ity abhidhiyate. Etad yo vetti tam prahuh, kshetrajna iti tad vidah.","This body is called the field, Arjuna. The one who knows it is called the knower of the field.")},
    {w:"N",t:"Your body, thoughts and feelings are like a field. Things grow in it, change, and pass. But who is watching the field?"},
    {act:"collect",key:"noticed",opts:P,w:"N",q:"Shine the light of awareness on each part of your field. Tap each one, and just notice it.",
     on:()=>[{w:"N",t:"Did you notice? You could <em>see</em> the tiredness, the worry and the pain. So you aren't only those things. You are the one who notices them."},
      {w:"K",t:"That knower, Arjuna, is your true self. And I am the knower in every field."}]}
  ]},
  {art:()=>day("happy"),steps:[
    {w:"K",t:"Then Krishna lists what true knowledge looks like in a person."},
    {w:"K",t:V(R(8),"अमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम्।<br>आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः॥","Amanitvam adambhitvam, ahimsa kshantir arjavam. Acharyopasanam shaucham, sthairyam atma vinigrahah.","Humility, no showing off, not harming, patience, honesty, respect for one's teacher, cleanliness, steadiness and self-control.")},
    {act:"choice",w:"N",q:"Which one would you most like to grow in yourself?",opts:[["Humility","humility"],["Patience","patience"],["Honesty","honesty"],["Steadiness","steadiness"]],
     on:k=>[{w:"N",t:{humility:"Humility isn't thinking less of yourself. It's thinking of yourself less.",patience:"Patience grows one pause at a time. Even one deep breath before reacting counts.",honesty:"Honesty starts inside: being truthful with yourself about how you really feel.",steadiness:"Steadiness is coming back again and again, even after you wobble."}[k]}]}
  ]},
  {art:()=>day("firm"),steps:[
    {w:"K",t:V(R(28),"समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्।<br>विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति॥","Samam sarveshu bhuteshu, tishthantam parameshvaram. Vinashyatsv avinashyantam, yah pashyati sa pashyati.","Whoever sees the Supreme Lord living equally in all beings, the undying within the dying, truly sees.")},
    {act:"write",w:"K",q:"Name one hard feeling you'll watch this week, like weather passing over a field.",ph:"e.g. stress before my shift",
     ref:R(2),rom:"Kshetrajna: the knower of the field",card:v=>TF("When <strong>{v}</strong> comes, I'll remember: I am the one who notices it, not the feeling itself.",v),
     on:()=>[{w:"N",t:"<em>Mausam badalta hai, aasmaan wahi rehta hai.</em> The weather changes; the sky stays the same."}]}
  ]}];})(),

 /* ===== Chapter 14: The three qualities ===== */
 14:(()=>{
  const day=(mA)=>svg(sky("#d8eef0","#f4fbfb",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const ITEMS=[["A calm walk in the morning","sattva","It leaves you clear and light."],
    ["Scrolling your phone until 2am","tamas","It feels easy, but leaves you heavy and foggy."],
    ["Rushing to win, whatever the cost","rajas","Lots of energy, but full of wanting and stress."],
    ["Helping someone without wanting praise","sattva","Pure and peaceful, with nothing to prove."],
    ["Always busy, never resting","rajas","Restless activity that never feels finished."],
    ["Eating junk and staying in bed all day","tamas","Dullness and heaviness, with no energy to do good."]];
  const jar=(x,g,n,label,sub)=>{const fill=g==="sattva"?"#bfe8f7":g==="rajas"?"#f29a7a":"#8a6a4a",lvl=40+n*55;
    const fx=g==="rajas"?Array.from({length:n*2},(_,i)=>`<circle cx="${-50+(i*37)%100}" cy="${-20-(i*29)%Math.max(lvl-20,20)}" r="8" fill="#fff" opacity=".6" class="bob" style="animation-delay:${i*.2}s"/>`).join(""):g==="sattva"&&n?`<circle cx="-30" cy="${-lvl+20}" r="6" fill="#fff"/><circle cx="25" cy="${-lvl+40}" r="4" fill="#fff"/>`:"";
    return `<g transform="translate(${x} 760)"><rect x="-90" y="-${lvl}" width="180" height="${lvl}" fill="${fill}"/>${fx}<path d="M-95 -260 V0 H95 V-260" fill="none" stroke="#6d5f80" stroke-width="7"/><rect x="-110" y="-280" width="220" height="24" rx="10" fill="#6d5f80"/><text y="60" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="40" fill="#2b2140">${T(label)}</text><text y="98" text-anchor="middle" font-family="Mukta,sans-serif" font-size="28" fill="#6d5f80">${T(sub)}</text></g>`;};
  return [
  {title:"Teen Gun",sub:"Chapter 14 · The three qualities",art:()=>day("happy"),steps:[
    {w:"K",t:"Arjuna, everything in nature, including your own mind, is a mix of three qualities, called gunas."}]},
  {art:()=>{const c=S.counts||{sattva:0,rajas:0,tamas:0};
     return svg(sky("#d8eef0","#f4fbfb")+hills("#9cc98a","#7fb36f")+jar(330,"sattva",c.sattva,"Sattva","calm and clear")+jar(800,"rajas",c.rajas,"Rajas","restless and busy")+jar(1270,"tamas",c.tamas,"Tamas","heavy and dull"));},
   steps:[
    {w:"K",t:V("Bhagavad Gita 14.5","सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः।<br>निबध्नन्ति महाबाहो देहे देहिनमव्ययम्॥","Sattvam rajas tama iti, gunah prakriti sambhavah. Nibadhnanti mahabaho, dehe dehinam avyayam.","Sattva, rajas and tamas: these three qualities come from nature, and they tie the eternal soul to the body.")},
    {w:"N",t:"Think of them like water. <strong>Sattva</strong> is clear, still water. <strong>Rajas</strong> is boiling water. <strong>Tamas</strong> is muddy water."},
    {act:"sort",items:ITEMS,w:"N",q:"",
     on:()=>[{w:"K",t:V("Bhagavad Gita 14.17","सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च।<br>प्रमादमोहौ तमसो भवतोऽज्ञानमेव च॥","Sattvat sanjayate jnanam, rajaso lobha eva cha. Pramada mohau tamaso, bhavato 'jnanam eva cha.","From sattva comes wisdom. From rajas comes greed. From tamas come carelessness, confusion and not knowing.")},
      {w:"N",t:"We all have all three, every day. The idea isn't to feel guilty. It's to notice which one is in charge, and gently choose more sattva."}]}
  ]},
  {art:()=>svg(sky("#ffd9a8","#fff3dd",`<circle cx="800" cy="360" r="150" fill="#fff1c1"/>`)+hills("#a6c97e","#86b062")+krishna(1060,780,.95,{bless:true,glow:true})+arjuna(620,780,.95,{mood:"firm"})),
   steps:[
    {w:"A",t:"Krishna, how can a person rise above all three?"},
    {w:"K",t:V("Bhagavad Gita 14.26","मां च योऽव्यभिचारेण भक्तियोगेन सेवते।<br>स गुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते॥","Mam cha yo 'vyabhicharena, bhakti yogena sevate. Sa gunan samatityaitan, brahma bhuyaya kalpate.","Whoever serves Me with steady, unwavering love rises above these three qualities and becomes ready to be one with the eternal.")},
    {act:"write",w:"K",q:"What's one small sattva habit you'll start this week?",ph:"e.g. no phone after 11pm, or a 10-minute morning walk",
     ref:"Bhagavad Gita 14.17",rom:"Sattvat sanjayate jnanam",card:v=>TF("My sattva habit this week: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Saaf paani jaisa mann.</em> A mind like clear water."}]}
  ]}];})(),

 /* ===== Chapter 15: The supreme person ===== */
 15:(()=>{
  const day=(mA,glow)=>svg(sky("#c9e4f5","#f2f9fd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const BR=["Needing approval","Chasing money","Comparing myself","Holding grudges"];
  const ends=[[240,620],[490,740],[770,740],[1010,620]];
  return [
  {title:"Purushottama Yoga",sub:"Chapter 15 · The supreme person",art:()=>day("happy"),steps:[
    {w:"N",t:"In Chapter 15, Krishna describes a very strange tree."}]},
  {art:()=>{const c=S.cut15||[];
     return svg(sky("#c9e4f5","#f2f9fd")+`<rect y="780" width="1600" height="120" fill="#9cc98a"/>`
      +`<g stroke="#8b4a1c" stroke-linecap="round" fill="none"><path d="M600 60 Q480 20 380 50 M600 60 Q720 20 820 50 M600 60 Q560 10 520 0 M600 60 Q650 10 690 0" stroke-width="12"/><path d="M600 60 V420" stroke-width="40"/></g>`
      +BR.map((b,i)=>{const [x,y]=ends[i],gone=c.includes(b);
        return `<g opacity="${gone?.18:1}"><path d="M600 ${380+i*8} Q${(600+x)/2} ${y-120} ${x} ${y-40}" stroke="#8b4a1c" stroke-width="16" fill="none" stroke-linecap="round" ${gone?'stroke-dasharray="20 14"':""}/><g fill="#4f9a48"><circle cx="${x-40}" cy="${y-40}" r="34"/><circle cx="${x+30}" cy="${y-30}" r="30"/><circle cx="${x}" cy="${y-70}" r="32"/></g></g>`
          +`<g transform="translate(${x} ${y+20})"><rect x="-115" y="-26" width="230" height="52" rx="26" fill="${gone?"#e7e2d8":"#fff6e6"}" stroke="#6b4a2c" stroke-width="3"/><text y="10" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="26" fill="${gone?"#a39a8c":"#2b2140"}" ${gone?'text-decoration="line-through"':""}>${T(b)}</text></g>`;}).join("")
      +krishna(1300,820,.85,{bless:true,glow:c.length>=BR.length}));},
   steps:[
    {w:"K",t:V("Bhagavad Gita 15.1","ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम्।<br>छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित्॥","Urdhva mulam adhah shakham, ashvattham prahur avyayam. Chhandamsi yasya parnani, yas tam veda sa veda vit.","They speak of an eternal peepal tree with its roots above and its branches below. Its leaves are the sacred hymns. Whoever understands this tree understands the Vedas.")},
    {w:"N",t:"This upside-down tree is the world we get tangled in. Its branches grow and grow, wrapping around us."},
    {w:"K",t:"Cut this deep-rooted tree with the strong axe of non-attachment, Arjuna. (15.3)"},
    {act:"collect",key:"cut15",opts:BR,w:"N",q:"Tap each tangled branch to cut it loose.",
     on:()=>[{w:"N",t:"Lighter already. Letting go doesn't mean you stop caring. It means these things stop pulling you around."}]}
  ]},
  {art:()=>{const h=!!S.heart;
     return svg(sky(h?"#ffe2b8":"#d8e6f2",h?"#fff6e6":"#eef4f9")+hills("#9cc98a","#7fb36f")+arjuna(800,860,1.15,{mood:h?"happy":"happy"})
      +`<g transform="translate(800 668) scale(.75)">${h?`<circle r="120" fill="#fff3b0" opacity=".6" class="pulse"/>`:""}<path d="M0 40 C-70 -10 -60 -70 -20 -70 C-5 -70 0 -58 0 -50 C0 -58 5 -70 20 -70 C60 -70 70 -10 0 40Z" fill="${h?"#e05a47":"#c9b8b8"}" stroke="#fff" stroke-width="4"/>${h?`<g transform="translate(4 -10) rotate(18) scale(.5)"><path d="M0 0 Q-12 -60 0 -105 Q14 -60 0 0Z" fill="#1f8a70"/><ellipse cy="-82" rx="12" ry="17" fill="#2fb3a0"/><circle cy="-82" r="7" fill="#1b3f8b"/></g>`:""}</g>`);},
   steps:[
    {w:"A",t:"But Krishna, after I cut myself free, where do I find You?"},
    {act:"dawn",label:"Put your hand on your heart",flag:"heart",w:"N",q:"Krishna's answer is very close. Put your hand on your heart, then tap the button.",
     on:()=>[{w:"K",t:V("Bhagavad Gita 15.15","सर्वस्य चाहं हृदि सन्निविष्टो मत्तः स्मृतिर्ज्ञानमपोहनं च।<br>वेदैश्च सर्वैरहमेव वेद्यो वेदान्तकृद्वेदविदेव चाहम्॥","Sarvasya chaham hridi sannivishto, mattah smritir jnanam apohanam cha. Vedaish cha sarvair aham eva vedyo, vedanta krid veda vid eva chaham.","I live in the heart of everyone. From Me come memory, knowledge and forgetting. I am the one to be known through all the Vedas.")},
      {w:"N",t:"You never have to search far. <em>Krishna dil mein hain.</em>"}]}
  ]},
  {art:()=>day("firm",true),steps:[
    {w:"K",t:"I am beyond everything that changes, and beyond even the unchanging. That is why I am called <em>Purushottama</em>, the Supreme Person. (15.18)"},
    {act:"write",w:"K",q:"What's one thing you're holding too tightly that you could loosen this week?",ph:"e.g. needing everyone at work to like me",
     ref:"Bhagavad Gita 15.3",rom:"Asanga shastrena dridhena chhittva",card:v=>TF("This week I'll loosen my grip on: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Pakad dheeli karo, dil halka hoga.</em> Loosen the grip, and the heart gets lighter."}]}
  ]}];})(),

 /* ===== Chapter 16: Divine and harmful qualities ===== */
 16:(()=>{
  const day=(mA,glow)=>svg(sky("#ffe2b8","#fff6e6",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#b6d39a","#9cc07f")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const GATES=["Kaam: selfish desire","Krodh: anger","Lobh: greed"];
  return [
  {title:"Daivi aur Asuri",sub:"Chapter 16 · Divine and harmful qualities",art:()=>day("happy"),steps:[
    {w:"N",t:"In Chapter 16, Krishna describes two kinds of qualities a person can have: divine ones, and harmful ones."}]},
  {art:()=>day("happy",true),steps:[
    {w:"K",t:V("Bhagavad Gita 16.1","अभयं सत्त्वसंशुद्धिर्ज्ञानयोगव्यवस्थितिः।<br>दानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम्॥","Abhayam sattva samshuddhir, jnana yoga vyavasthitih. Danam damash cha yajnash cha, svadhyayas tapa arjavam.","Fearlessness, a pure heart, steadiness in wisdom, generosity, self-control, sacrifice, study of scripture, discipline and honesty…")},
    {w:"K",t:"…and kindness, truthfulness, freedom from anger, compassion, gentleness, forgiveness and patience. These are the divine qualities. (16.1–3)"},
    {act:"choice",w:"N",q:"Which divine quality can you already see in yourself, even a little?",opts:[["Fearlessness","f"],["Generosity","g"],["Honesty","h"],["Compassion","c"],["Forgiveness","fo"]],
     on:()=>[{w:"A",t:"But Krishna, sometimes I see the harmful qualities in me too. Am I a bad person?"},
      {w:"K",t:V("Bhagavad Gita 16.5","दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता।<br>मा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव॥","Daivi sampad vimokshaya, nibandhayasuri mata. Ma shuchah sampadam daivim, abhijato 'si pandava.","Divine qualities lead to freedom, and harmful ones lead to bondage. But don't worry, Arjuna. You were born with divine qualities.")},
      {w:"N",t:"<em>Ma shuchah</em>: don't worry. The good is already in you. You just keep choosing it."}]}
  ]},
  {art:()=>{const c=S.closed||[],all=c.length>=GATES.length;
     return svg(sky(all?"#ffcf8a":"#cdbfd8",all?"#fff3dd":"#efe8f3",all?`<circle cx="800" cy="360" r="150" fill="#fff1c1"/>`:"")+hills("#a6c97e","#86b062")
      +GATES.map((g,i)=>{const x=330+i*470,cl=c.includes(g);
        return `<g transform="translate(${x} 760)"><path d="M-140 0 V-300 Q0 -420 140 -300 V0Z" fill="#8a7a6a"/><path d="M-110 0 V-285 Q0 -385 110 -285 V0Z" fill="${cl?"#a8763e":"#5a1f1f"}"/>${cl?`<g class="grow"><line x1="0" y1="-370" x2="0" y2="0" stroke="#6b4a2c" stroke-width="5"/><rect x="-22" y="-160" width="44" height="40" rx="8" fill="#f4c430"/><path d="M-12 -160 v-14 a12 12 0 0 1 24 0 v14" stroke="#f4c430" stroke-width="6" fill="none"/></g>`:`<circle cy="-140" r="80" fill="#e05a47" opacity=".35" class="pulse"/>`}<rect x="-150" y="20" width="300" height="56" rx="28" fill="#fff6e6"/><text y="58" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700" font-size="30" fill="#2b2140">${T(g)}</text></g>`;}).join(""));},
   steps:[
    {w:"K",t:V("Bhagavad Gita 16.21","त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः।<br>कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत्॥","Trividham narakasyedam, dvaram nashanam atmanah. Kamah krodhas tatha lobhas, tasmad etat trayam tyajet.","There are three gates to hell that destroy a person: selfish desire, anger and greed. So give up all three.")},
    {act:"collect",key:"closed",opts:GATES,w:"N",q:"Close and lock all three gates.",
     on:()=>[{w:"N",t:"All three gates are closed, and the sky has brightened. Krishna says that someone free of these three walks towards the highest good (16.22)."}]}
  ]},
  {art:()=>day("firm",true),steps:[
    {act:"write",w:"K",q:"Which gate will you keep closed this week, and how?",ph:"e.g. Anger: I'll walk away for 5 minutes before I reply",
     ref:"Bhagavad Gita 16.21",rom:"Kamah krodhas tatha lobhas",card:v=>TF("The gate I'll keep closed: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Teen darwaze band, ek raasta khula.</em> Three gates closed, one path open."}]}
  ]}];})(),

 /* ===== Chapter 17: Three kinds of faith ===== */
 17:(()=>{
  const day=(mA,glow)=>svg(sky("#d8eef0","#f4fbfb",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#9cc98a","#7fb36f")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const FOOD=[["Fresh fruit, and dal with rice","sattva","Fresh, light and nourishing. It keeps the mind calm."],
    ["Extra-spicy, very salty fried snacks","rajas","Very hot, salty and sharp. It stirs the mind up."],
    ["Food left out overnight that's gone stale","tamas","Stale food makes us feel heavy and dull."],
    ["Warm milk with a little honey","sattva","Gentle and soothing."],
    ["Strong coffee to keep going all night","rajas","Restless energy, and a crash afterwards."],
    ["Takeaway reheated from three days ago","tamas","Old food with little life left in it."]];
  const bowl=(x,y,label,n,col)=>`<g transform="translate(${x} ${y})"><ellipse rx="130" ry="44" fill="#d9c9a8"/><ellipse rx="110" ry="32" fill="#efe3c8"/>${Array.from({length:n},(_,i)=>`<circle class="grow" cx="${-50+i*50}" cy="-6" r="20" fill="${col}"/>`).join("")}<text y="90" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="36" fill="#2b2140">${T(label)}</text></g>`;
  return [
  {title:"Shraddha",sub:"Chapter 17 · Three kinds of faith",art:()=>day("happy"),steps:[
    {w:"K",t:V("Bhagavad Gita 17.3","सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत।<br>श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः॥","Sattvanurupa sarvasya, shraddha bhavati bharata. Shraddhamayo 'yam purusho, yo yach chhraddhah sa eva sah.","Everyone's faith matches their nature, Arjuna. A person is made of their faith. Whatever they put their faith in, that is what they become.")},
    {w:"N",t:"Remember the three gunas from Chapter 14? Krishna shows how they appear even in what we eat, say and give."}]},
  {art:()=>{const c=S.counts||{sattva:0,rajas:0,tamas:0};
     return svg(sky("#d8eef0","#f4fbfb")+hills("#9cc98a","#7fb36f")+`<ellipse cx="800" cy="560" rx="700" ry="250" fill="#d4a017"/><ellipse cx="800" cy="560" rx="660" ry="225" fill="#f4c430"/>`
      +bowl(380,520,"Sattva",c.sattva,"#7cc576")+bowl(800,520,"Rajas",c.rajas,"#e8552f")+bowl(1220,520,"Tamas",c.tamas,"#8a6a4a"));},
   steps:[
    {act:"sort",items:FOOD,prompt:"Which bowl does this go in?",w:"N",q:"",
     on:()=>[{w:"N",t:"Krishna describes sattvic food as fresh, wholesome and pleasing, food that brings health, strength and happiness (17.8)."}]}
  ]},
  {art:()=>day("happy"),steps:[
    {w:"N",t:"Now for speech. Your friend says, “You're always late! You never take anything seriously.”"},
    {act:"choice",w:"N",q:"Which reply is true, kind <em>and</em> helpful?",opts:[["“And you're always nagging!”","a"],["Say nothing and sulk all day","b"],["“You're right, I was late. I'm sorry. I'll leave earlier next time.”","c"]],
     on:k=>[{w:"N",t:k==="c"?"Yes. That one is honest, kind and useful, all at once.":"That's a very human reaction! The third reply is the one Krishna describes: honest, kind and useful, all at once."},
      {w:"K",t:V("Bhagavad Gita 17.15","अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत्।<br>स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते॥","Anudvega karam vakyam, satyam priya hitam cha yat. Svadhyayabhyasanam chaiva, van mayam tapa uchyate.","Words that don't hurt others, that are true, kind and helpful, together with regular study of scripture: this is called discipline of speech.")}]}
  ]},
  {art:()=>day("firm",true),steps:[
    {w:"K",t:V("Bhagavad Gita 17.20","दातव्यमिति यद्दानं दीयतेऽनुपकारिणे।<br>देशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम्॥","Datavyam iti yad danam, diyate 'nupakarine. Deshe kale cha patre cha, tad danam sattvikam smritam.","A gift given simply because it is right to give, to someone who can't repay it, at the right place and time, to the right person: that is sattvic giving.")},
    {act:"write",w:"K",q:"Who's one person you'll speak to this week with words that are true, kind and helpful?",ph:"e.g. my brother, after our argument",
     ref:"Bhagavad Gita 17.15",rom:"Satyam priya hitam cha yat",card:v=>TF("This week my words will be true, kind and helpful with: <strong>{v}</strong>",v),
     on:()=>[{w:"N",t:"<em>Jaisa khaana, jaisi vaani, waisa mann.</em> As our food and our words are, so is our mind."}]}
  ]}];})(),

 /* ===== Chapter 18: Freedom by letting go ===== */
 18:(()=>{
  const day=(mA,glow)=>svg(sky("#ffd9a8","#fff3dd",`<circle cx="1330" cy="170" r="80" fill="#ffe28a"/>`)+hills("#a6c97e","#86b062")+krishna(1060,780,.95,{bless:true,glow:!!glow})+arjuna(620,780,.95,{mood:mA||"happy"}));
  const diya=(x,y,lit)=>`<g transform="translate(${x} ${y})">${lit?`<circle cy="-30" r="44" fill="#ffd36b" opacity=".3"/>`:""}<path d="M-40 0 Q0 30 40 0 Z" fill="#d9622b"/>${lit?`<path class="flick" d="M0 -44 C18 -22 15 0 0 2 C-15 0 -18 -22 0 -44Z" fill="#ffd36b"/>`:`<line x1="0" y1="0" x2="0" y2="-14" stroke="#5a3a20" stroke-width="4"/>`}</g>`;
  return [
  {title:"Moksha Sanyasa",sub:"Chapter 18 · Freedom by letting go",art:()=>day("happy"),steps:[
    {w:"N",t:"The last chapter. Krishna brings together everything He has taught Arjuna."}]},
  {art:()=>day("happy",true),steps:[
    {w:"A",t:"Krishna, what does it really mean to let go?"},
    {w:"K",t:"Letting go doesn't mean running away from your work. It means doing your duty, while letting go of selfishness and the hunger for results. (18.9)"},
    {w:"K",t:V("Bhagavad Gita 18.47","श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।<br>स्वभावनियतं कर्म कुर्वन्नाप्नोति किल्बिषम्॥","Shreyan sva dharmo vigunah, para dharmat svanushthitat. Svabhava niyatam karma, kurvan napnoti kilbisham.","It is better to follow your own path imperfectly than someone else's path perfectly. Doing the work that suits your nature, you do no wrong.")}
  ]},
  {art:()=>day("happy",true),steps:[
    {w:"K",t:V("Bhagavad Gita 18.63","इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया।<br>विमृश्यैतदशेषेण यथेच्छसि तथा कुरु॥","Iti te jnanam akhyatam, guhyad guhyataram maya. Vimrishyaitad asheshena, yathechchhasi tatha kuru.","I have told you this wisdom, more secret than any secret. Think it over fully, and then do as you choose.")},
    {w:"N",t:"After all this teaching, Krishna doesn't force Arjuna. He leaves the choice to him."},
    {act:"choice",w:"N",q:"Now the choice is yours too. What will you do with what you've learnt?",opts:[["Try one lesson every day","daily"],["Come back when I'm stressed","stress"],["Share it with my family","share"],["Keep thinking it over","think"]],
     on:()=>[{w:"K",t:"Every one of these is a good choice. <em>Yathechchhasi tatha kuru</em>: do as you choose."}]}
  ]},
  {art:()=>day("happy",true),steps:[
    {w:"N",t:"And then, Krishna gives His final, most loving promise."},
    {w:"K",t:V("Bhagavad Gita 18.66","सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।<br>अहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥","Sarva dharman parityajya, mam ekam sharanam vraja. Aham tvam sarva papebhyo, mokshayishyami ma shuchah.","Set aside all other duties and take refuge in Me alone. I will free you from all wrongs. Do not grieve.")},
    {w:"N",t:"<em>Ma shuchah.</em> Do not grieve. The Gita began with Arjuna crying, and it ends with these two words."}
  ]},
  {art:()=>S.ready
      ? svg(sky("#ffcf8a","#fff3dd",`<circle cx="800" cy="360" r="160" fill="#fff1c1"/>`)+hills("#9bb08f","#7c9a6c")+krishna(1080,800,.95,{bless:true,glow:true})+arjuna(600,800,.95,{bow:true,mood:"firm"}))
      : svg(sky("#c8b6d8","#efe6f2")+hills("#9bb08f","#7c9a6c")+krishna(1080,800,.95,{bless:true})+arjuna(600,800,.95,{sit:true,mood:"sad"})),
   steps:[
    {w:"K",t:"Have you heard all this with full attention, Arjuna? Has your confusion gone? (18.72)"},

const scenes=ALL[CH];

/* ---------- engine ---------- */
const $=id=>document.getElementById(id);
const stage=$("stage"), who=$("who"), say=$("say"), act=$("act"), nextB=$("next"), backB=$("back"), dots=$("dots"), tts=$("tts"), cardHost=$("cardHost");
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
const NAMES={K:"Krishna",A:"Arjuna",N:"Story"};
let sc=0, queue=[], pos=-1, waiting=false;

scenes.forEach(()=>dots.appendChild(document.createElement("span")));

function draw(){
  stage.innerHTML=scenes[sc].art()+(scenes[sc].title?`<div class="titlecard"><div class="t">${T(scenes[sc].title===true?"Arjuna ka Dukh,<br>Krishna ka Gyaan":scenes[sc].title)}</div><div class="s">${T(scenes[sc].sub||"An interactive Bhagavad Gita story")}</div></div>`:"");
  [...dots.children].forEach((d,i)=>{d.className=i<sc?"done":i===sc?"on":"";});
  const b=document.getElementById("bowOnGround"); if(b) b.addEventListener("click",e=>{e.stopPropagation();liftBow();});
}
function speak(html){
  if(!synth) return; try{synth.cancel();}catch(e){}
  if(!tts.checked) return;
  const t=html.replace(/<[^>]+>/g,""); try{const u=new SpeechSynthesisUtterance(t);u.rate=.95;const want=LANG==="gu"?/gu-IN/i:LANG==="hi"?/hi-IN/i:/en-IN|en-GB/i;u.lang=LANG==="gu"?"gu-IN":LANG==="hi"?"hi-IN":"en-IN";const v=synth.getVoices().find(v=>want.test(v.lang));if(v)u.voice=v;synth.speak(u);}catch(e){}
}
function show(step){
  const t=T(typeof step.t==="function"?step.t():(step.t||step.q));
  who.textContent=T(NAMES[step.w]); who.className="who "+step.w;
  say.innerHTML=t; speak(t);
}
function startScene(i){
  sc=i; queue=scenes[i].steps.slice(); pos=-1; waiting=false; act.innerHTML="";
  draw(); advance();
}
function advance(){
  if(waiting) return;
  if(pos>=queue.length-1){ if(sc<scenes.length-1) startScene(sc+1); else finish(); return; }
  pos++; const st=queue[pos]; act.innerHTML="";
  show(st);
  if(st.act){ waiting=true; nextB.disabled=true; ACTS[st.act](st); }
  else nextB.disabled=false;
  backB.disabled=(sc===0&&pos===0);
}
function done(st,arg){
  act.innerHTML=""; waiting=false; nextB.disabled=false;
  const extra=st.on?st.on(arg):[];
  queue.splice(pos+1,0,...extra);
  draw(); advance();
}
function finish(){
  nextB.disabled=true; act.innerHTML="";
  const b=document.createElement("button"); b.textContent=T("Play again"); b.onclick=()=>storyOne(CH);
  act.appendChild(b);
  try{localStorage.setItem("gs-story-"+CH,"done");}catch(e){}
  const c=document.createElement("button"); c.type="button"; c.className="ghost"; c.textContent=T("Back to chapters"); c.onclick=()=>chapters(); act.appendChild(c);
}
function btn(label,cls,fn){const b=document.createElement("button");b.type="button";b.className=cls||"opt";b.innerHTML=T(label);b.onclick=fn;act.appendChild(b);return b;}

const ACTS={

  ladder(st){S.rung=0;const show=()=>{act.innerHTML="";const L=st.levels[S.rung];who.textContent=T("Krishna");who.className="who K";say.innerHTML=T(L.t);draw();
    btn(L.yes,"",()=>{act.innerHTML="";done(st,L);});
    if(S.rung<st.levels.length-1)btn("That's too hard for me right now","opt",()=>{S.rung++;show();});};show();},
  sort(st){S.counts={sattva:0,rajas:0,tamas:0};let i=0;const N={sattva:"Sattva",rajas:"Rajas",tamas:"Tamas"};
    const show=()=>{act.innerHTML="";const it=st.items[i];who.textContent=T("Story");who.className="who N";
      say.innerHTML=`${T(st.prompt||"Which water is this?")} <strong>“${T(it[0])}”</strong> <span class="tiny">${T(`(${i+1} of ${st.items.length})`)}</span>`;
      ["sattva","rajas","tamas"].forEach(g=>btn(N[g],"opt",()=>{act.innerHTML="";S.counts[it[1]]++;draw();
        say.innerHTML=T(g===it[1]?"Yes! It's {v}.":"Good guess, but it's actually {v}.").split("{v}").join(`<strong>${T(N[it[1]])}</strong>`)+" "+T(it[2]);i++;
        btn(i<st.items.length?"Next":"See what Krishna says","",()=>{if(i<st.items.length)show();else done(st);});}));};show();},

  tapcount(st){S[st.key]=0;const b=btn(st.label(0),"",()=>{S[st.key]++;draw();if(S[st.key]>=st.n){b.remove();setTimeout(()=>done(st),st.wait||900);}else b.innerHTML=T(st.label(S[st.key]));});},
  collect(st){S[st.key]=[];st.opts.forEach(o=>btn(o,"opt",function(){this.remove();S[st.key].push(o);draw();if(S[st.key].length>=st.opts.length)setTimeout(()=>done(st),st.wait||900);}));},

  still(st){const b=btn("Start","",()=>{b.disabled=true;let n=10;b.textContent=T("Do nothing… 10");const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);b.remove();done(st);}else b.textContent=T("Do nothing… "+n);},1000);});},
  chain(st){let i=0;const b=btn(st.chain[0],"opt",()=>{S.flame=(S.flame||0)+1;draw();i++;if(i>=st.chain.length){b.remove();setTimeout(()=>done(st),900);}else b.innerHTML=T(st.chain[i]);});},
  dawn(st){btn(st.label||"Bring back the light","",function(){this.remove();S[st.flag||"light"]=true;draw();setTimeout(()=>done(st),1200);});},
  cut(st){const wrap=document.createElement("div");wrap.className="field";wrap.innerHTML=`<input id="doubtIn" type="text" maxlength="40" placeholder="${T(st.ph)}" aria-label="${T("Your doubt")}"><button type="button" id="doubtGo">${T("Put it into words")}</button>`;act.appendChild(wrap);
    const go=()=>{const v=$("doubtIn").value.trim();if(!v){$("doubtIn").focus();return;}S.doubt=v;draw();act.innerHTML="";say.innerHTML=T("There it is, tangled up. Now cut through it.");
      btn("Cut it with the sword of knowledge","",function(){this.remove();S.cut=true;draw();setTimeout(()=>done(st),1000);});};
    $("doubtGo").onclick=go;$("doubtIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.stopPropagation();go();}});},
  pop(st){S.popped=[];st.opts.forEach(o=>{btn(T(o)+" · "+T("come back"),"opt",function(){this.remove();S.popped.push(o);draw();if(S.popped.length>=st.opts.length)setTimeout(()=>done(st),700);});});},
  write(st){const wrap=document.createElement("div");wrap.className="field";wrap.innerHTML=`<input id="wIn" type="text" maxlength="90" placeholder="${T(st.ph)}" aria-label="${T("Your answer")}"><button type="button" id="wGo">${T("Make my card")}</button>`;act.appendChild(wrap);
    const go=()=>{const v=$("wIn").value.trim();if(!v){$("wIn").focus();return;}
      cardHost.innerHTML=`<div class="blessing">${LANG==="en"?`<div class="v">${st.rom}</div>`:""}<div class="m">${st.card(esc(v))}</div><div class="f">${TR(st.ref)}</div><div><button type="button" id="copyCard" class="opt">${T("Copy my card")}</button></div></div>`;
      $("copyCard").onclick=function(){const b=this;const txt=cardHost.querySelector(".m").innerText+"\n"+cardHost.querySelector(".f").innerText;try{navigator.clipboard.writeText(txt).then(()=>b.textContent=T("Copied"),()=>b.textContent=T("Select the text above to copy"));}catch(e){b.textContent=T("Select the text above to copy");}};
      done(st);};
    $("wGo").onclick=go;$("wIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.stopPropagation();go();}});},
  choice(st){ st.opts.forEach(([label,key])=>btn(label,"opt",()=>{ if(st.q.includes("Arjuna feels")) done(st,key==="all"?"all":label.toLowerCase()); else done(st,key); })); },
  breath(st){
    const b=document.createElement("button"); b.type="button"; b.className="hold"; b.innerHTML="<i></i><span>"+T("Hold and breathe in")+"</span>"; act.appendChild(b);
    const fill=b.querySelector("i"), lab=b.querySelector("span"); let t0=0,raf=0,full=false;
    const tick=()=>{const p=Math.min(1,(performance.now()-t0)/3000); fill.style.width=(p*100)+"%"; if(p>=1){full=true;lab.textContent=T("Now let go, breathe out");return;} raf=requestAnimationFrame(tick);};
    const down=e=>{e.preventDefault(); full=false; t0=performance.now(); lab.textContent=T("Breathing in…"); raf=requestAnimationFrame(tick);};
    const up=()=>{if(!t0) return; t0=0; cancelAnimationFrame(raf); fill.style.width="0";
      if(full){ S.breaths++; draw(); if(S.breaths>=3){ setTimeout(()=>done(st),700); return;} lab.textContent=T(`Good. Again (${S.breaths} of 3)`); }
      else lab.textContent=T(S.breaths?`Hold a little longer (${S.breaths} of 3)`:"Hold a little longer"); full=false; };
    b.addEventListener("pointerdown",down); b.addEventListener("pointerup",up); b.addEventListener("pointerleave",up); b.addEventListener("pointercancel",up);
    b.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)down(e);}); b.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")up();});
  },
  farm(st){
    const plant=btn("Plant a seed (0 of 3)","",()=>{
      if(S.seeds>=3) return; S.seeds++; draw(); plant.innerHTML=T(`Plant a seed (${S.seeds} of 3)`);
      if(S.seeds>=3){ plant.remove();
        who.textContent=T("Story"); who.className="who N"; say.innerHTML=T("Well done. Now, can you make it rain?");
        const r=btn("Make it rain","opt",()=>{ r.remove();
          who.textContent=T("Krishna"); who.className="who K"; say.innerHTML=T("<em>Arey!</em> That is not in your hands. Just wait…"); speak(say.innerHTML);
          setTimeout(()=>{S.rained=true; draw(); setTimeout(()=>done(st),1600);},1600); });
      }
    });
  },
  winds(st){
    const send=(word,color,key)=>{
      S[key]=true; const g=stage.querySelector("#words"); if(!g) return;
      const y=key==="praise"?330:420;
      g.insertAdjacentHTML("beforeend",`<text class="floatword" x="0" y="${y}" font-family="Baloo 2,sans-serif" font-weight="800" font-size="70" fill="${color}" stroke="#fff" stroke-width="3" paint-order="stroke">${T(word)}</text>`);
      if(S.praise&&S.crit) setTimeout(()=>done(st),2600);
    };
    btn("Send praise: <em>“Wah! Shabash!”</em>","opt",function(){this.disabled=true;send("Wah! Shabash!","#2f9e5a","praise");});
    btn("Send criticism: <em>“Bekaar!”</em>","opt",function(){this.disabled=true;send("Bekaar!","#d9534f","crit");});
  },
  bow(st){ btn("Pick up the bow","",()=>liftBow()); ACTS._bowSt=st; },
  duty(st){
    const wrap=document.createElement("div"); wrap.className="field";
    wrap.innerHTML=`<input id="dutyIn" type="text" maxlength="90" placeholder="${T("e.g. Study for one hour, or call Dadi")}"><button type="button" id="dutyGo">${T("Make my card")}</button>`;
    act.appendChild(wrap);
    const go=()=>{const v=$("dutyIn").value.trim(); if(!v){$("dutyIn").focus();return;} S.duty=v; makeCard(); done(st);};
    $("dutyGo").onclick=go; $("dutyIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.stopPropagation();go();}});
    setTimeout(()=>{try{$("dutyIn").focus();}catch(e){}},50);
  }
};
function liftBow(){ if(S.bowUp||!ACTS._bowSt) return; S.bowUp=true; draw(); const st=ACTS._bowSt; ACTS._bowSt=null; setTimeout(()=>done(st),900); }
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function makeCard(){
  cardHost.innerHTML=`<div class="blessing">${LANG==="en"?`<div class="v">Karmanye vadhikaraste, ma phaleshu kadachana</div>`:`<div class="v" lang="sa">${SCR("कर्मण्येवाधिकारस्ते मा फलेषु कदाचन")}</div>`}
   <div class="m">${T("Today, with my full heart, I will:")}<br><strong>${esc(S.duty)}</strong></div>
   <div class="f">${T("The effort is mine. The result is the rain.")} · ${TR("Bhagavad Gita 2.47")}</div>
   <div><button type="button" id="copyCard" class="opt">${T("Copy my card")}</button></div></div>`;
  $("copyCard").onclick=function(){const txt=cardHost.querySelector(".m").innerText+"\n"+cardHost.querySelector(".f").innerText;
    const b=this; const ok=()=>{b.textContent=T("Copied");};
    try{navigator.clipboard.writeText(txt).then(ok,()=>{b.textContent=T("Select the text above to copy");});}catch(e){b.textContent=T("Select the text above to copy");}};
}

nextB.onclick=advance;
